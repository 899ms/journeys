<style>
:root{--paper:#0a0806;--ink:#d9c4a3;--ink-rgb:217,196,163;--poem:#e6d3b3;}

html,body{margin:0;height:100%;background:var(--paper);overflow:hidden;overscroll-behavior:none;}

@media (orientation:portrait){
  #app{width:100vh;height:100vw;transform-origin:0 0;transform:translate(100vw,0) rotate(90deg);}
}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;cursor:crosshair;}
#cv.grab{cursor:grab;}

.ui{position:absolute;z-index:5;color:var(--ink);transition:color .8s linear;pointer-events:none;}
#hud{left:1.6rem;top:1.3rem;letter-spacing:.12em;line-height:1.5;}
#hud .shot{font-size:1.05rem;}

#hud .var .cnt{margin-left:1.2em;opacity:.9;font-variant-numeric:tabular-nums;}
#ctl{right:1.4rem;top:1.15rem;display:flex;gap:.45rem;pointer-events:auto;}
.btn{pointer-events:auto;cursor:pointer;border:1px solid rgba(var(--ink-rgb),.5);color:var(--ink);background:rgba(10,8,6,.3);
  font:inherit;font-size:.72rem;letter-spacing:.18em;padding:.42rem .8rem .38rem;border-radius:999px;transition:background .3s,color .8s linear,border-color .8s linear,opacity .3s;backdrop-filter:blur(2px);}
.btn:hover{background:rgba(var(--ink-rgb),.14);}
.btn.off{opacity:.42;}

<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="vig"></div>
  <div id="hud" class="ui"><div class="shot"><span id="shotName">桥上俯瞰</span><small id="shotEn">OVERHEAD</small></div><div class="var"><span id="varNo">VAR 01</span><span class="mode" id="modeTxt">AUTO</span><span class="cnt" id="cntTxt">灯 00</span></div></div>
  <div id="ctl" class="ui">
    <button class="btn" id="btnWish" title="放一盏灯">放灯 · 写一句愿</button>

  <div id="intro">
    <div class="box">
      <h1>河灯<small>LANTERNS</small></h1>
      <p>夜里的河灯顺流而下：古镇、芦荡、庙会、雨夜、月湾。<br>每盏灯带一句愿。世界、镜头、声音与诗句全部程序化生成，永不重复。</p>
      <div class="scenes" id="scenes">
        <button class="scene sel" data-s="0"><i style="background:#c98a4a"></i>古镇</button>
        <button class="scene" data-s="1"><i style="background:#3d4a33"></i>芦荡</button>
        <button class="scene" data-s="2"><i style="background:#b3402e"></i>庙会</button>
        <button class="scene" data-s="3"><i style="background:#3a4452"></i>雨夜</button>
        <button class="scene" data-s="4"><i style="background:#c9c3a8"></i>月湾</button>
      </div>
      <button id="start">顺流而下 →</button>
      <div class="hint">点击水面投一颗石子，涟漪会推开河灯 · 「放灯」写一句愿，它会漂进这条河 · 拖拽转镜头 · 滚轮缩放<br>选择起点，之后沿同一条河漂下去</div>
    </div>
  </div>
</div>
<script>
'use strict';
/* ================= 基础工具 ================= */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{t=t<0?0:t>1?1:t;return t*t*(3-2*t);};
const smoother=t=>{t=t<0?0:t>1?1:t;return t*t*t*(t*(t*6-15)+10);};
function hash1(i){i=i|0;i=(i^61)^(i>>>16);i=Math.imul(i,9);i^=i>>>4;i=Math.imul(i,0x27d4eb2d);i^=i>>>15;return (i>>>0)/4294967296;}
function hash2(x,y){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)|0;h=(h^(h>>>13))|0;h=Math.imul(h,1274126177);return ((h^(h>>>16))>>>0)/4294967296;}
function hash3(x,y,z){return hash2(x|0,(y|0)+Math.imul(z|0,7919));}
function noise1(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash1(i),hash1(i+1),u);}
function noise2(x,y){const i=Math.floor(x),j=Math.floor(y),f=x-i,g=y-j,u=f*f*(3-2*f),v=g*g*(3-2*g);
  return lerp(lerp(hash2(i,j),hash2(i+1,j),u),lerp(hash2(i,j+1),hash2(i+1,j+1),u),v);}
function fbm1(x,o){let s=0,a=.5,f=1,n=0;for(let k=0;k<o;k++){s+=a*(noise1(x*f)-.5)*2;n+=a;a*=.5;f*=2.1;}return s/n;}
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};}
function hexc(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
const _tmpc=[0,0,0];
function mixc(a,b,t,o){o=o||_tmpc;o[0]=a[0]+(b[0]-a[0])*t;o[1]=a[1]+(b[1]-a[1])*t;o[2]=a[2]+(b[2]-a[2])*t;return o;}
function rgba(c,a){return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+(a===undefined?1:a)+')';}
function shade(c,k,o){o=o||_tmpc;o[0]=c[0]*k;o[1]=c[1]*k;o[2]=c[2]*k;return o;}

/* ================= 五种风格 = 五段河 ================= */
/* 0 古镇 TOWN · 1 芦荡 REEDS · 2 庙会 TEMPLE · 3 雨夜 RAIN · 4 月湾 MOONBAY */
/* 皮影：岸上的一切都是黑色剪影，只有窗和灯是透光的暖色 */
const STYLE_NAMES=['古镇 TOWN','芦荡 REEDS','庙会 TEMPLE','雨夜 RAIN','月湾 MOONBAY'];
const PAL_SRC=[
{ skyTop:'#08070a',skyHor:'#2a1a12',haze:'#1a120c',water:'#0d0a0a',waterFar:'#241812',bank:'#050404',ink:'#3a2a20',window:'#ffb45c',red:'#ff5a3a',lamp:'#ffc070',paper:'#f5c9a0',
  glowSky:'#a05a2a',moonC:'#f0e6d0',reed:'#0c0a08',ui:'#d9c4a3',
  fogDist:1200,windows:1,houses:1,temple:.15,bridges:1,reeds:.2,willow:.6,rain:0,moon:0,fog:.1,piers:1,star:.15,skyGlow:.7,root:38,cricket:.3,lanternRate:1 },
{ skyTop:'#050607',skyHor:'#12160f',haze:'#0d100c',water:'#080908',waterFar:'#151a12',bank:'#040403',ink:'#2a3020',window:'#ffb45c',red:'#ff5a3a',lamp:'#ffc070',paper:'#f5c9a0',
  glowSky:'#3a4a2a',moonC:'#f0e6d0',reed:'#0a0c07',ui:'#c9c4a3',
  fogDist:900,windows:.05,houses:.08,temple:0,bridges:.15,reeds:1,willow:.2,rain:0,moon:0,fog:.35,piers:.3,star:.9,skyGlow:.1,root:36,cricket:1,lanternRate:.6 },
{ skyTop:'#0a0605',skyHor:'#3a160e',haze:'#22100a',water:'#100807',waterFar:'#2e1510',bank:'#050303',ink:'#3a1a14',window:'#ffb45c',red:'#ff4a2c',lamp:'#ffd080',paper:'#f5c9a0',
  glowSky:'#c04a22',moonC:'#f0e6d0',reed:'#0c0806',ui:'#e0c0a0',
  fogDist:1100,windows:1,houses:.9,temple:1,bridges:.8,reeds:.1,willow:.4,rain:0,moon:0,fog:.15,piers:1,star:.05,skyGlow:1,root:40,cricket:.1,lanternRate:1.4 },
{ skyTop:'#07080b',skyHor:'#1a1d24',haze:'#14171d',water:'#0a0b0e',waterFar:'#1a1d22',bank:'#040405',ink:'#2a2e36',window:'#ffb45c',red:'#ff5a3a',lamp:'#ffc070',paper:'#f5c9a0',
  glowSky:'#4a4a5a',moonC:'#f0e6d0',reed:'#0a0b0d',ui:'#c4c4c8',
  fogDist:600,windows:.6,houses:.6,temple:.05,bridges:.6,reeds:.4,willow:.5,rain:1,moon:0,fog:.6,piers:.6,star:0,skyGlow:.3,root:35,cricket:0,lanternRate:.8 },
{ skyTop:'#070a12',skyHor:'#1c2436',haze:'#131a28',water:'#0a0e18',waterFar:'#1a2438',bank:'#040506',ink:'#2a3040',window:'#ffb45c',red:'#ff5a3a',lamp:'#ffc070',paper:'#f5c9a0',
  glowSky:'#3a4a6a',moonC:'#f4eedc',reed:'#080a0e',ui:'#c9c8c0',
  fogDist:1800,windows:.15,houses:.15,temple:0,bridges:.3,reeds:.3,willow:.3,rain:0,moon:1,fog:.05,piers:.4,star:.8,skyGlow:.15,root:43,cricket:.5,lanternRate:.7 }
];
const PAL=PAL_SRC.map(p=>{const o={};for(const k in p){const v=p[k];o[k]=typeof v==='string'?hexc(v):v;}return o;});
const COLKEYS=Object.keys(PAL[0]).filter(k=>Array.isArray(PAL[0][k]));
const NUMKEYS=Object.keys(PAL[0]).filter(k=>typeof PAL[0][k]==='number');
const SEG=2400,BAND=600;
let startStyle=0;
function styleIdx(k){return (((startStyle+k)%5)+5)%5;}
function frontOffset(k,y){return 150*(noise1(y/300+k*7.31)-.5)*2+60*(noise1(y/90+k*3.7+9)-.5)*2;}
function styleAt(x,y,o){o=o||{a:0,b:0,t:0};const k=Math.floor(x/SEG);
  const d0=x-(k*SEG+frontOffset(k-1,y));const t0=smooth((d0+BAND*.5)/BAND);
  if(t0<1){o.a=styleIdx(k-1);o.b=styleIdx(k);o.t=t0;return o;}
  const d1=x-((k+1)*SEG+frontOffset(k,y));o.a=styleIdx(k);o.b=styleIdx(k+1);o.t=smooth((d1+BAND*.5)/BAND);return o;}
function blendPal(s,o){o=o||{};const A=PAL[s.a],B=PAL[s.b],t=s.t;
  for(const k of COLKEYS){o[k]=mixc(A[k],B[k],t,o[k]||[0,0,0]);}
  for(const k of NUMKEYS){o[k]=lerp(A[k],B[k],t);}
  o.a=s.a;o.b=s.b;o.t=t;return o;}
const _sc={a:0,b:0,t:0};
function colAt(key,x,y,o){styleAt(x,y,_sc);return mixc(PAL[_sc.a][key],PAL[_sc.b][key],_sc.t,o);}
function numAt(key,x,y){styleAt(x,y,_sc);return lerp(PAL[_sc.a][key],PAL[_sc.b][key],_sc.t);}
function fogT(d,dist){const t=(d-dist*.15)/(dist*1.1);return t<=0?0:Math.min(.96,1-Math.exp(-t*t*2.4));}

/* ================= 河：中线、半宽、流场 ================= */
function riverY(x){return 180*Math.sin(x/1100)+70*Math.sin(x/390+1.3)+22*Math.sin(x/120+.4);}
function riverHalf(x){return 70+22*Math.sin(x/640+2)+10*Math.sin(x/173);}
function riverSlope(x){return (riverY(x+8)-riverY(x-8))/16;}
const FLOWMAX=13;
/* 流速：中间快，岸边慢；给出世界坐标速度 */
const FLW={vx:0,vy:0};
function flowAt(x,y,o){o=o||FLW;const ry=riverY(x),h=riverHalf(x);const d=(y-ry)/h;const sp=FLOWMAX*Math.max(.06,1-d*d)*(1+.15*fbm1(x/300,2));const sl=riverSlope(x);const l=Math.hypot(1,sl);
  o.vx=sp/l;o.vy=sp*sl/l;
  // 桥墩后的回旋：略微绕开
  return o;}

/* ================= 相机与投影 ================= */
let W=800,H=600,DPR=1,ctx=null,T=0;
const CAM={x:0,y:0,z:200,yaw:0,pitch:.9,fov:1.0,focal:600,pcx:400,pcy:300,fx:1,fy:0,fz:0,rx:0,ry:-1,rz:0,ux:0,uy:0,uz:1};
const NEAR=2;
function camPrep(){const cy=Math.cos(CAM.yaw),sy=Math.sin(CAM.yaw),cp=Math.cos(CAM.pitch),sp=Math.sin(CAM.pitch);
  CAM.fx=cy*cp;CAM.fy=sy*cp;CAM.fz=-sp;CAM.rx=sy;CAM.ry=-cy;CAM.rz=0;CAM.ux=cy*sp;CAM.uy=sy*sp;CAM.uz=cp;
  let f=H*.5/Math.tan(CAM.fov*.5);const maxH=W*.5/Math.tan(.87);if(f<maxH)f=maxH;CAM.focal=f;
  CAM.pcx=W*.45;CAM.pcy=H*.5;}
const CS=new Float64Array(150),CP=new Float64Array(150);
function toCam(x,y,z,o,i){const dx=x-CAM.x,dy=y-CAM.y,dz=z-CAM.z;o[i]=dx*CAM.rx+dy*CAM.ry;o[i+1]=dx*CAM.ux+dy*CAM.uy+dz*CAM.uz;o[i+2]=dx*CAM.fx+dy*CAM.fy+dz*CAM.fz;}
function clipNear(src,n,dst){let m=0;for(let k=0;k<n;k++){const a=k*3,b=((k+1)%n)*3,az=src[a+2],bz=src[b+2],ain=az>NEAR,bin=bz>NEAR;
  if(ain){dst[m]=src[a];dst[m+1]=src[a+1];dst[m+2]=az;m+=3;}
  if(ain!==bin){const t=(NEAR-az)/(bz-az);dst[m]=src[a]+(src[b]-src[a])*t;dst[m+1]=src[a+1]+(src[b+1]-src[a+1])*t;dst[m+2]=NEAR;m+=3;}}
  return m/3;}
let PB_x0=0,PB_y0=0,PB_x1=0,PB_y1=0;
function pathPoly(p,n,open,noBegin){let allIn=true,anyIn=false;
  for(let k=0;k<n;k++){toCam(p[k*3],p[k*3+1],p[k*3+2],CS,k*3);if(CS[k*3+2]>NEAR)anyIn=true;else allIn=false;}
  if(!anyIn)return false;let src=CS,m=n;if(!allIn){if(open)return false;m=clipNear(CS,n,CP);src=CP;if(m<3)return false;}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;if(!noBegin)ctx.beginPath();
  for(let k=0;k<m;k++){const z=src[k*3+2],s=CAM.focal/z,sx=CAM.pcx+src[k*3]*s,sy=CAM.pcy-src[k*3+1]*s;
    if(k)ctx.lineTo(sx,sy);else ctx.moveTo(sx,sy);if(sx<x0)x0=sx;if(sx>x1)x1=sx;if(sy<y0)y0=sy;if(sy>y1)y1=sy;}
  if(!open)ctx.closePath();PB_x0=x0;PB_y0=y0;PB_x1=x1;PB_y1=y1;return !(x1<0||x0>W||y1<0||y0>H);}
const PP={sx:0,sy:0,d:0,s:0};
function projPt(x,y,z,o){o=o||PP;const dx=x-CAM.x,dy=y-CAM.y,dz=z-CAM.z;const d=dx*CAM.fx+dy*CAM.fy+dz*CAM.fz;if(d<=NEAR){o.d=d;return false;}
  const s=CAM.focal/d;o.sx=CAM.pcx+(dx*CAM.rx+dy*CAM.ry)*s;o.sy=CAM.pcy-(dx*CAM.ux+dy*CAM.uy+dz*CAM.uz)*s;o.d=d;o.s=s;return true;}
function camDist(x,y,z){const dx=x-CAM.x,dy=y-CAM.y,dz=z-CAM.z;return Math.sqrt(dx*dx+dy*dy+dz*dz);}
function horizonY(){return CAM.pcy-CAM.focal*Math.tan(CAM.pitch);}
const MOON={az:2.6,el:.36,x:0,y:0,z:0};MOON.x=Math.cos(MOON.el)*Math.cos(MOON.az);MOON.y=Math.cos(MOON.el)*Math.sin(MOON.az);MOON.z=Math.sin(MOON.el);
const SC={a:0,b:0,t:0},SF={a:0,b:0,t:0};
const PC=blendPal(styleAt(0,0,SC)),PF=blendPal(styleAt(0,0,SF));
const _c1=[0,0,0],_c2=[0,0,0],_c3=[0,0,0],_c4=[0,0,0];
function fogCol(c,d,o){return mixc(c,PC.haze,fogT(d,PC.fogDist),o);}

/* ================= 河的两岸：皮影 ================= */
const IS_TOUCH=matchMedia('(pointer: coarse)').matches;
const STA=new Map();const STEP=120;
function getStation(k){let s=STA.get(k);if(s)return s;if(STA.size>300)STA.clear();const R=rng(k*7919+31);const x0=k*STEP,xm=x0+60;const ry0=riverY(xm);
  const houses=numAt('houses',xm,ry0),reeds=numAt('reeds',xm,ry0),willow=numAt('willow',xm,ry0),piers=numAt('piers',xm,ry0),temple=numAt('temple',xm,ry0),bridges=numAt('bridges',xm,ry0);
  s={houses:[],reeds:[],willows:[],pier:null,temple:null,bridge:null,k};STA.set(k,s);
  for(const side of [-1,1]){
    if(R()<houses*.9){let x=x0+R()*18;while(x<x0+STEP-8){const w=16+R()*18;const xc=x+w*.5;const half=riverHalf(xc);const off=half+7+R()*9;const ry=riverY(xc)+side*off;
      s.houses.push({x:xc,y:ry,ang:Math.atan(riverSlope(xc)),w,d:16+R()*10,h:11+R()*13,rh:4+R()*5,side,win:R(),eave:R()<.55,lamp:R()<.3,f2:R()<.35});x+=w+(R()<.22?8+R()*26:0);}}
    const nr=Math.floor(reeds*(2+R()*5));for(let i=0;i<nr;i++){const x=x0+R()*STEP;const half=riverHalf(x);s.reeds.push({x,y:riverY(x)+side*(half+(R()*22-8)),n:6+Math.floor(R()*8),h:8+R()*9,ph:R()*TAU,side});}
    if(R()<willow*.45){const x=x0+R()*STEP;const half=riverHalf(x);s.willows.push({x,y:riverY(x)+side*(half+12+R()*22),s:14+R()*10,side,ph:R()*TAU});}
    if(!s.pier&&R()<piers*.3){const x=x0+20+R()*80;const half=riverHalf(x);s.pier={x,y:riverY(x)+side*(half-1),side,figure:R()<.85,nextT:0,relT:-10,ang:Math.atan(riverSlope(x))};}}
  if(R()<temple*.3){const side=R()<.5?-1:1;const half=riverHalf(xm);s.temple={x:xm,y:ry0+side*(half+34),side,w:64,d:38,h:24,ang:Math.atan(riverSlope(xm))};}
  if(k%7===3&&R()<bridges*.9){s.bridge={x:xm,h:13+R()*8,lamps:R()<.7,rail:1};}
  return s;}

/* 天：暗，靠地平线有镇上的光晕；月；星 */
function drawSky(yh){const g=ctx.createLinearGradient(0,yh-H*1.1,0,yh);g.addColorStop(0,rgba(PC.skyTop));g.addColorStop(.72,rgba(mixc(PC.skyTop,PC.skyHor,.5,_c1)));g.addColorStop(1,rgba(PC.skyHor));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);drawStars(yh);
  // 镇上的光晕：沿河前方地平线处一团暖
  if(PC.skyGlow>.02){const sl=riverSlope(CAM.x+600);const l=Math.hypot(1,sl);haloAt(1/l,sl/l,.05,H*.55,PC.glowSky,PC.skyGlow*.45);}
  if(PC.moon>.02)drawMoon(yh);
  // 地面：岸是黑纸
  const yTop=Math.max(0,yh);if(yTop<H){ctx.fillStyle=rgba(mixc(PC.bank,PC.haze,.35,_c1));ctx.fillRect(0,yTop,W,H-yTop);
    if(yh>-60&&yh<H){const g2=ctx.createLinearGradient(0,yh,0,yh+H*.16);g2.addColorStop(0,rgba(PC.haze,.9));g2.addColorStop(1,rgba(PC.haze,0));ctx.fillStyle=g2;ctx.fillRect(0,yh,W,H*.16);}}}
const STARS=[];for(let i=0;i<160;i++){const az=hash1(i*3+1)*TAU,el=.06+hash1(i*3+2)*1.4;STARS.push({dx:Math.cos(az)*Math.cos(el),dy:Math.sin(az)*Math.cos(el),dz:Math.sin(el),s:.5+hash1(i*3+3)*1.3,ph:hash1(i*7)*TAU,f:.4+hash1(i*11)*1.4});}
function drawStars(yh){const a0=clamp((PC.star-.02)/.7,0,1);if(a0<.01)return;ctx.fillStyle='#fff';
  for(const s of STARS){const d=s.dx*CAM.fx+s.dy*CAM.fy+s.dz*CAM.fz;if(d<.05)continue;const k=CAM.focal/d;
    const sx=CAM.pcx+(s.dx*CAM.rx+s.dy*CAM.ry)*k,sy=CAM.pcy-(s.dx*CAM.ux+s.dy*CAM.uy+s.dz*CAM.uz)*k;if(sx<0||sx>W||sy<0||sy>yh-4)continue;
    ctx.globalAlpha=a0*(.5+.5*Math.sin(T*s.f+s.ph))*.8;ctx.beginPath();ctx.arc(sx,sy,s.s*(.6+.6*a0),0,TAU);ctx.fill();}
  ctx.globalAlpha=1;}
function haloAt(dx,dy,dz,R,col,amt){if(amt<.01)return;const d=dx*CAM.fx+dy*CAM.fy+dz*CAM.fz;if(d<.02)return;const k=CAM.focal/d;
  const sx=CAM.pcx+(dx*CAM.rx+dy*CAM.ry)*k,sy=CAM.pcy-(dx*CAM.ux+dy*CAM.uy+dz*CAM.uz)*k;if(sx<-R||sx>W+R||sy<-R||sy>H+R)return;
  const g=ctx.createRadialGradient(sx,sy,0,sx,sy,R);g.addColorStop(0,rgba(col,.8*amt));g.addColorStop(.25,rgba(col,.4*amt));g.addColorStop(.6,rgba(col,.12*amt));g.addColorStop(1,rgba(col,0));ctx.fillStyle=g;ctx.fillRect(sx-R,sy-R,R*2,R*2);}
function drawMoon(yh){const m=PC.moon;const d=MOON.x*CAM.fx+MOON.y*CAM.fy+MOON.z*CAM.fz;haloAt(MOON.x,MOON.y,MOON.z,H*.5,mixc(PC.moonC,PC.skyHor,.5,_c2),m*.7);if(d<.05)return;const k=CAM.focal/d;
  const sx=CAM.pcx+(MOON.x*CAM.rx+MOON.y*CAM.ry)*k,sy=CAM.pcy-(MOON.x*CAM.ux+MOON.y*CAM.uy+MOON.z*CAM.uz)*k;if(sx<-60||sx>W+60||sy<-60||sy>yh)return;const r=Math.max(6,H*.03);
  ctx.fillStyle=rgba(PC.moonC,.92*m);ctx.beginPath();ctx.arc(sx,sy,r,0,TAU);ctx.fill();}

/* 河面：一段段铺；远处融进雾；近处有暗纹 */
const RP=new Float64Array(12);
function drawRiver(){const x0=Math.floor((CAM.x-900)/24)*24,x1=CAM.x+1500;
  for(let x=x0;x<x1;x+=24){const xm=x+12;const ry=riverY(xm);const dd=camDist(xm,ry,0);if(dd>PC.fogDist*1.5)continue;
    const ya=riverY(x),yb=riverY(x+24),ha=riverHalf(x)+2,hb=riverHalf(x+24)+2;
    RP[0]=x;RP[1]=ya-ha;RP[2]=0;RP[3]=x+24;RP[4]=yb-hb;RP[5]=0;RP[6]=x+24;RP[7]=yb+hb;RP[8]=0;RP[9]=x;RP[10]=ya+ha;RP[11]=0;
    if(!pathPoly(RP,4))continue;mixc(PC.water,PC.waterFar,fogT(dd,PC.fogDist*.9),_c1);ctx.fillStyle=rgba(_c1);ctx.fill();
    // 暗纹
    if(dd<500){const k=Math.floor(x/24);if(hash1(k*5+3)<.5){const off=(hash1(k*9+1)-.5)*ha*1.3;const sh=Math.sin(T*.9+k*1.7)*2.5;
      if(projPt(x+2,ya+off+sh,.1,PP)){const sx=PP.sx,sy=PP.sy;if(projPt(x+22,yb+off+sh,.1,PP)){ctx.strokeStyle=rgba(PC.waterFar,.5*(1-dd/500));ctx.lineWidth=Math.max(.5,Math.min(1.2,PP.s));ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(PP.sx,PP.sy);ctx.stroke();}}}}}}
/* 灯光在水里的倒影：一条抖动的竖光带 */
const REFL=[];
function drawReflections(){ctx.save();ctx.globalCompositeOperation='lighter';
  for(const r of REFL){if(!projPt(r.x,r.y,-r.z,PP))continue;const s=PP.s;const wd=Math.max(1,r.w*.45*s),len=Math.max(4,r.z*3.2*s)*(1+PC.rain*.6);const n=Math.min(14,Math.max(4,Math.round(len/4)));
    ctx.fillStyle=rgba(r.col,1);for(let k=0;k<n;k++){const f=k/n;const y=PP.sy-len*.1+f*len*1.1;const wob=Math.sin(T*3.1+r.x*.37+k*1.9)*wd*.8+Math.sin(T*1.7+k*.7+r.y*.2)*wd*.5;const ww=wd*(1.2+.9*Math.sin(k*2.3+T*2+r.x));
      ctx.globalAlpha=r.a*(1-f)*(.55+.45*Math.sin(T*4+k*1.3+r.x*.5));ctx.fillRect(PP.sx+wob-ww*.5,y,ww,Math.max(1,len/n*.55));}}
  ctx.globalAlpha=1;ctx.restore();REFL.length=0;
  // 月光路：月亮方向的河面上一串碎光
  if(PC.moon>.05){const lx=Math.cos(MOON.az),ly=Math.sin(MOON.az);const face=lx*CAM.fx+ly*CAM.fy;if(face>.15){const a=PC.moon*smooth((face-.15)/.6)*clamp(1-CAM.z/200,0,1);ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=rgba(PC.moonC,1);
    for(let k=0;k<90;k++){const h1=hash1(k*3+1),h2=hash1(k*3+2);const d=30+h1*h1*700;const spread=(h2-.5)*(20+d*.25);const x=CAM.x+lx*d-ly*spread,y=CAM.y+ly*d+lx*spread;if(Math.abs(y-riverY(x))>riverHalf(x))continue;if(!projPt(x,y,0,PP))continue;
      const tw=Math.max(0,Math.sin(T*(2+hash1(k*7))*1.3+k*2.3));const sz=clamp(PP.s*1.6,.8,4);ctx.globalAlpha=a*tw*.7;ctx.fillRect(PP.sx-sz,PP.sy-sz*.3,sz*2,sz*.6);}
    ctx.globalAlpha=1;ctx.restore();}}}
function addRefl(x,y,z,w,col,a){if(REFL.length<160)REFL.push({x,y,z,w,col,a});}

/* 屋：黑剪影，窗是透光的皮 */
const HV=new Float64Array(36),FACE=new Float64Array(18);
function drawHouse(hs,dd){const c=Math.cos(hs.ang),s=Math.sin(hs.ang);const w2=hs.w*.5,d2=hs.d*.5,h=hs.h,r=hs.h+hs.rh;const fogt=fogT(dd,PC.fogDist);
  const put=(k,u,v,z)=>{HV[k*3]=hs.x+u*c-v*s;HV[k*3+1]=hs.y+u*s+v*c;HV[k*3+2]=z;};
  put(0,-w2,-d2,0);put(1,w2,-d2,0);put(2,w2,d2,0);put(3,-w2,d2,0);put(4,-w2,-d2,h);put(5,w2,-d2,h);put(6,w2,d2,h);put(7,-w2,d2,h);put(8,-w2,0,r);put(9,w2,0,r);
  // 翘檐：屋脊两端抬高
  const ev=hs.eave?hs.rh*.5:0;put(10,-w2*1.12,-d2*1.1,h+ev);put(11,w2*1.12,-d2*1.1,h+ev);put(12,w2*1.12,d2*1.1,h+ev);put(13,-w2*1.12,d2*1.1,h+ev);
  fogCol(PC.bank,dd,_c1);const body=rgba(_c1);const faces=[{i:[0,1,5,4],w:1,f:-1},{i:[2,3,7,6],w:1,f:1},{i:[1,2,6,9,5],w:1},{i:[3,0,4,8,7],w:1},{i:[10,11,9,8]},{i:[12,13,8,9]}];
  for(const f of faces){const n=f.i.length;for(let k=0;k<n;k++){FACE[k*3]=HV[f.i[k]*3];FACE[k*3+1]=HV[f.i[k]*3+1];FACE[k*3+2]=HV[f.i[k]*3+2];}
    const ax=FACE[0],ay=FACE[1],az=FACE[2],bx=FACE[3]-ax,by=FACE[4]-ay,bz=FACE[5]-az,cx=FACE[6]-ax,cy=FACE[7]-ay,cz=FACE[8]-az;const nx=by*cz-bz*cy,ny=bz*cx-bx*cz,nz=bx*cy-by*cx;
    if(nx*(CAM.x-ax)+ny*(CAM.y-ay)+nz*(CAM.z-az)<=0)continue;if(!pathPoly(FACE,n))continue;ctx.fillStyle=body;ctx.fill();
    // 临河面的窗
    if(f.w&&n===4&&PC.windows>.02&&hs.win<.85&&dd<700&&f.f===-hs.side){const len=Math.hypot(HV[f.i[1]*3]-HV[f.i[0]*3],HV[f.i[1]*3+1]-HV[f.i[0]*3+1]);const ux=(HV[f.i[1]*3]-HV[f.i[0]*3])/len,uy=(HV[f.i[1]*3+1]-HV[f.i[0]*3+1])/len;
      const cols=Math.max(1,Math.floor(len/8)),rows=hs.f2?2:1;for(let rr=0;rr<rows;rr++)for(let q=0;q<cols;q++){if(hash3(Math.floor(hs.x),q,rr)<.35)continue;const mx=HV[f.i[0]*3]+ux*((q+.5)*len/cols),my=HV[f.i[0]*3+1]+uy*((q+.5)*len/cols);const ww=Math.min(2.6,len/cols*.3),wh=2.2;const cz0=h*(rows===2?(.3+rr*.4):.5);
        FACE[0]=mx-ux*ww;FACE[1]=my-uy*ww;FACE[2]=cz0-wh;FACE[3]=mx+ux*ww;FACE[4]=my+uy*ww;FACE[5]=cz0-wh;FACE[6]=mx+ux*ww;FACE[7]=my+uy*ww;FACE[8]=cz0+wh;FACE[9]=mx-ux*ww;FACE[10]=my-uy*ww;FACE[11]=cz0+wh;
        if(pathPoly(FACE,4)){const fl=.75+.25*Math.sin(T*.8+hs.win*20+q*1.3);const a=PC.windows*fl*(1-fogt);ctx.fillStyle=rgba(PC.window,a);ctx.fill();
          if(PB_x1-PB_x0>7){ctx.strokeStyle=rgba(PC.bank,.8);ctx.lineWidth=.7;ctx.beginPath();const xm=(PB_x0+PB_x1)/2,ym=(PB_y0+PB_y1)/2;ctx.moveTo(xm,PB_y0);ctx.lineTo(xm,PB_y1);ctx.moveTo(PB_x0,ym);ctx.lineTo(PB_x1,ym);ctx.stroke();}
          if(dd<420)addRefl(mx,my,cz0,ww*2,PC.window,.28*a);}}}}
  // 檐下灯笼
  if(hs.lamp&&PC.windows>.05&&dd<600){const lx=hs.x-(hs.side)*d2*1.05*(-s)*0+(-hs.side)*(d2*1.05)*(-s),ly=hs.y+(-hs.side)*(d2*1.05)*c;const lz=h*.8;
    if(projPt(lx,ly,lz,PP)){const rr=Math.max(1.5,PP.s*1.6);drawGlow(PP.sx,PP.sy,rr*4,PC.lamp,.75*(1-fogt));ctx.fillStyle=rgba(PC.lamp,.95*(1-fogt));ctx.beginPath();ctx.ellipse(PP.sx,PP.sy,rr*.8,rr,0,0,TAU);ctx.fill();addRefl(lx,ly,lz,3,PC.lamp,.3*(1-fogt));}}}
function drawGlow(sx,sy,R,col,a){const g=ctx.createRadialGradient(sx,sy,0,sx,sy,R);g.addColorStop(0,rgba(col,.55*a));g.addColorStop(.35,rgba(col,.18*a));g.addColorStop(1,rgba(col,0));ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=g;ctx.fillRect(sx-R,sy-R,R*2,R*2);ctx.restore();}
/* 庙：双重檐，檐下一排红灯 */
function drawTemple(tp,dd){const hs={x:tp.x,y:tp.y,ang:tp.ang,w:tp.w,d:tp.d,h:tp.h,rh:9,side:tp.side,win:.2,eave:true,lamp:false,f2:true};drawHouse(hs,dd);
  const hs2={x:tp.x,y:tp.y,ang:tp.ang,w:tp.w*.7,d:tp.d*.7,h:tp.h+10,rh:7,side:tp.side,win:.95,eave:true,lamp:false,f2:false};drawHouse(hs2,dd);
  const fogt=fogT(dd,PC.fogDist);const c=Math.cos(tp.ang),s=Math.sin(tp.ang);
  for(let k=0;k<5;k++){const u=(k-2)*tp.w*.2;const v=-tp.side*(tp.d*.5+3);const lx=tp.x+u*c-v*s,ly=tp.y+u*s+v*c,lz=tp.h*.85-1.5*(k%2);
    if(projPt(lx,ly,lz,PP)){const rr=Math.max(1.5,PP.s*1.5);const fl=.85+.15*Math.sin(T*3+k);drawGlow(PP.sx,PP.sy,rr*4.5,PC.red,.8*fl*(1-fogt));ctx.fillStyle=rgba(PC.red,.95*(1-fogt));ctx.beginPath();ctx.ellipse(PP.sx,PP.sy,rr*.8,rr,0,0,TAU);ctx.fill();if(dd<500)addRefl(lx,ly,lz,3,PC.red,.32*(1-fogt));}}}
/* 桥：拱桥剪影，横跨河面；灯过桥洞 */
const BP=new Float64Array(78);
function drawBridge(b,dd){const x=b.x;const ry=riverY(x);const half=riverHalf(x)+10;const h=b.h;const fogt=fogT(dd,PC.fogDist);fogCol(PC.bank,dd,_c1);const body=rgba(_c1);
  for(const fx of [x+6,x-6]){let n=0;const N=12;
    for(let k=0;k<=N;k++){const u=-half+k/N*half*2;const z=h*Math.max(0,1-Math.pow(u/(half*.82),2))+.3;BP[n*3]=fx;BP[n*3+1]=ry+u;BP[n*3+2]=Math.max(.3,z);n++;}
    for(let k=N;k>=0;k--){const u=-half+k/N*half*2;const z=h+6+3*Math.cos(u/half*1.4);BP[n*3]=fx;BP[n*3+1]=ry+u;BP[n*3+2]=z;n++;}
    if(pathPoly(BP,n)){ctx.fillStyle=body;ctx.fill();}}
  // 桥面与栏杆
  const N=12;let n=0;for(let k=0;k<=N;k++){const u=-half+k/N*half*2;const z=h+6+3*Math.cos(u/half*1.4);BP[n*3]=x-6;BP[n*3+1]=ry+u;BP[n*3+2]=z;n++;}
  for(let k=N;k>=0;k--){const u=-half+k/N*half*2;const z=h+6+3*Math.cos(u/half*1.4);BP[n*3]=x+6;BP[n*3+1]=ry+u;BP[n*3+2]=z;n++;}
  if(pathPoly(BP,n)){ctx.fillStyle=rgba(shade(_c1,1.8,_c2));ctx.fill();}
  if(dd<600){ctx.strokeStyle=body;ctx.lineWidth=Math.max(.6,Math.min(2,CAM.focal/dd*1.2));ctx.beginPath();
    for(let k=0;k<=8;k++){const u=-half+k/8*half*2;const z=h+6+3*Math.cos(u/half*1.4);for(const fx of [x-6,x+6]){if(!projPt(fx,ry+u,z,PP))continue;const sx=PP.sx,sy=PP.sy;if(!projPt(fx,ry+u,z+3.5,PP))continue;ctx.moveTo(sx,sy);ctx.lineTo(PP.sx,PP.sy);}}
    ctx.stroke();}
  if(b.lamps&&PC.windows>.05){for(const u of [-half*.55,half*.55]){const z=h+6+3*Math.cos(u/half*1.4)+4;for(const fx of [x-6,x+6]){if(!projPt(fx,ry+u,z,PP))continue;const rr=Math.max(1.2,PP.s*1.2);drawGlow(PP.sx,PP.sy,rr*4,PC.lamp,.7*(1-fogt));ctx.fillStyle=rgba(PC.lamp,.9);ctx.beginPath();ctx.arc(PP.sx,PP.sy,rr*.7,0,TAU);ctx.fill();addRefl(fx,ry+u,z,2.5,PC.lamp,.25*(1-fogt));}}}}
/* 芦苇、柳、码头与放灯的人 */
function drawReed(r,dd){const sc0=CAM.focal/Math.max(NEAR,dd);if(sc0*r.h<2)return;fogCol(PC.reed,dd,_c1);ctx.strokeStyle=rgba(_c1,.95);ctx.lineWidth=Math.max(.5,sc0*.7);ctx.lineCap='round';ctx.beginPath();
  for(let k=0;k<r.n;k++){const x=r.x+(k-r.n*.5)*2.1,y=r.y+hash1(k*3+1)*3;const sw=Math.sin(T*.8+r.ph+k)*1.4;if(!projPt(x,y,0,PP))continue;const sx=PP.sx,sy=PP.sy;if(!projPt(x+sw,y+sw*.4,r.h*(.75+hash1(k*5)*.5),PP))continue;ctx.moveTo(sx,sy);ctx.lineTo(PP.sx,PP.sy);
    if(sc0>1.2&&hash1(k*11)<.4){ctx.moveTo(PP.sx,PP.sy);ctx.lineTo(PP.sx+sc0*.6,PP.sy-sc0*2.2);}}
  ctx.stroke();}
function drawWillow(w,dd){if(!projPt(w.x,w.y,0,PP))return;const px=PP.sx,py=PP.sy;const s=PP.s;const size=w.s*s;if(size<1.5)return;fogCol(PC.bank,dd,_c1);
  projPt(w.x,w.y,w.s*1.7,PP);const tx=PP.sx,ty=PP.sy;ctx.strokeStyle=rgba(_c1,.98);ctx.lineWidth=Math.max(.8,size*.14);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(tx,ty);ctx.stroke();
  ctx.lineWidth=Math.max(.5,size*.045);ctx.beginPath();for(let k=0;k<9;k++){const a=(k/9-.5)*2.2;const sw=Math.sin(T*.7+w.ph+k)*size*.06;const x0=tx+Math.cos(a)*size*.35,y0=ty+size*.05;const x1=x0+Math.sin(a)*size*.5+sw,y1=y0+size*(1.2+.3*hash1(k+w.x));

function drawPier(p,dd){const fogt=fogT(dd,PC.fogDist);fogCol(PC.bank,dd,_c1);const c=Math.cos(p.ang),s=Math.sin(p.ang);

    HV[0]=p.x-w*c-v*s;HV[1]=p.y-w*s+v*c;HV[2]=z;HV[3]=p.x+w*c-v*s;HV[4]=p.y+w*s+v*c;HV[5]=z;HV[6]=p.x+w*c-(v-p.side*3)*s;HV[7]=p.y+w*s+(v-p.side*3)*c;HV[8]=z;HV[9]=p.x-w*c-(v-p.side*3)*s;HV[10]=p.y-w*s+(v-p.side*3)*c;HV[11]=z;

  const x=CAM.x+30+Math.random()*30;const ry=riverY(x),half=riverHalf(x);const side=(CAM.y-ry)>=0?1:-1;const l=spawnLantern(x,ry+side*(half-6),t,true,0);l.vy=-side*6;l.type=0;
  LANT.push(l);if(LANT.length>NL+30){let oldest=0;for(let i=1;i<LANT.length;i++)if(!LANT[i].user&&LANT[i].born<LANT[oldest].born)oldest=i;LANT.splice(oldest,1);}

function templeDrum(){const t=AC.currentTime;const vol=.35*PC.temple;const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(48,t+.35);const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+.6);o.connect(g);g.connect(master);o.start(t);o.stop(t+.7);
  const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=300;const g2=AC.createGain();g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(vol*.5,t+.005);g2.gain.exponentialRampToValueAtTime(.001,t+.25);s.connect(f);f.connect(g2);g2.connect(master);s.start(t);s.stop(t+.3);}
function templeBell(){const t=AC.currentTime;const vol=.2*PC.temple;for(const [r,a] of [[1,.5],[2.42,.25],[3.9,.12],[5.4,.06]]){const o=AC.createOscillator();o.type='sine';o.frequency.value=170*r;const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol*a,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+6/Math.sqrt(r));o.connect(g);g.connect(PLUCK);o.start(t);o.stop(t+6.5);}}
function updateAudio(){if(!AC)return;const t=AC.currentTime;const near=clamp(1-CAM.z/60,0,1);
  AMB.lapG.gain.setTargetAtTime(.06+.16*near,t,.3);AMB.flowG.gain.setTargetAtTime(.05+.1*near,t,.4);AMB.rainG.gain.setTargetAtTime(.14*PC.rain,t,.5);
  AMB.padG.gain.setTargetAtTime(.03+.02*PC.temple,t,.6);for(const p of AMB.padOsc)p.o.frequency.setTargetAtTime(midiHz(PF.root+p.iv),t,2.5);
  for(let k=0;k<2;k++){if(T>AMB.cricketT[k]){if(PC.cricket>.05&&soundOn)cricketChirp(k);AMB.cricketT[k]=T+.5+Math.random()*2.6/(.2+PC.cricket);}}
  if(PC.temple>.3){if(T>AMB.drumT){if(soundOn)templeDrum();AMB.drumT=T+3+Math.random()*7;}if(AMB.bellT===0)AMB.bellT=T+20+Math.random()*30;else if(T>AMB.bellT){if(soundOn)templeBell();AMB.bellT=T+50+Math.random()*60;}}
  // 灯从镜头旁经过：一声拨弦
  for(const l of LANT){if(l.lit<.3)continue;const d=camDist(l.x,l.y,1);if(d<48&&!l.passed){l.passed=true;lanternPass(l);}else if(d>80)l.passed=false;}}
function toggleSound(){soundOn=!soundOn;const b=document.getElementById('btnMusic');b.classList.toggle('off',!soundOn);b.textContent=soundOn?'♪ 声音':'♪ 静音';
  if(AC){const t=AC.currentTime;master.gain.cancelScheduledValues(t);master.gain.setTargetAtTime(soundOn?.9:0,t,.6);}}

/* ================= 诗句层 ================= */
const POEMS=[
 {t:'放',l:['把一句话折进纸里','点上火','交给水']},
 {t:'流',l:['河不问你写了什么','它只负责','带走']},
 {t:'桥',l:['过桥洞的时候','灯都低一低头','像进了谁的家']},
 {t:'芦',l:['芦苇留下几盏','不是拦','是想多看一会儿']},
 {t:'灭',l:['灭了的灯还在漂','愿望轻','纸更轻']},
 {t:'庙',l:['庙前的红灯不动','河里的灯都在动','它们互相看']},
 {t:'雨',l:['雨落进河里','一圈一圈','把每盏灯的光揉开']},
 {t:'月',l:['月亮也放了一盏','就在你那盏旁边','整夜都没熄']},
 {t:'岸',l:['岸上的人放完就走了','灯不知道','一直以为有人在看']},
 {t:'数',l:['数到第一百盏','才发现','有一盏是自己的']},
 {t:'你',l:['你写的那句话','现在在下游','被一个不认识的人读了']},
 {t:'停',l:['有的灯停下来','不是搁浅','是到了']},
 {t:'归',l:['没有终点','只有下一个弯','和更多的灯']}];
const POEM={on:true,i:0,state:0,at:0};
const poemEl=document.getElementById('poem');
function showPoem(p){poemEl.className='ui';poemEl.innerHTML='';const t=document.createElement('div');t.className='t';t.textContent=p.t;poemEl.appendChild(t);
  const r=document.createElement('div');r.className='rule';poemEl.appendChild(r);let n=0;
  for(const line of p.l){const d=document.createElement('div');d.className='l';for(const ch of line){const s=document.createElement('span');s.className='c';s.textContent=ch;s.style.transitionDelay=(1.2+n*.11)+'s';d.appendChild(s);n++;}poemEl.appendChild(d);}
  requestAnimationFrame(()=>requestAnimationFrame(()=>poemEl.classList.add('on')));}
function updatePoem(){if(!POEM.on)return;const el=T-POEM.at;
  if(POEM.state===0){if(el>4){showPoem(POEMS[POEM.i%POEMS.length]);POEM.state=1;POEM.at=T;}}
  else if(POEM.state===1){if(el>17){poemEl.classList.add('fade');POEM.state=2;POEM.at=T;}}
  else if(POEM.state===2){if(el>3.2){poemEl.innerHTML='';poemEl.className='ui';POEM.i++;POEM.state=0;POEM.at=T+5+Math.random()*6;}}}
function togglePoem(){POEM.on=!POEM.on;const b=document.getElementById('btnPoem');b.classList.toggle('off',!POEM.on);poemEl.classList.toggle('hidden',!POEM.on);
  if(POEM.on){POEM.state=0;POEM.at=T-2;}else{poemEl.innerHTML='';}}

/* ================= 主循环与 UI ================= */
const cv=document.getElementById('cv');let running=false,lastNow=0;const root=document.documentElement;
function resize(){rotated=window.innerHeight>window.innerWidth;W=rotated?window.innerHeight:window.innerWidth;H=rotated?window.innerWidth:window.innerHeight;
  DPR=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx=cv.getContext('2d');ctx.setTransform(DPR,0,0,DPR,0,0);grainPat=null;}
window.addEventListener('resize',()=>setTimeout(resize,60));
let uiTick=0;
function updateUI(){uiTick++;if(uiTick%6)return;const ink=PC.ui;root.style.setProperty('--ink',rgba(ink));root.style.setProperty('--ink-rgb',(ink[0]|0)+','+(ink[1]|0)+','+(ink[2]|0));root.style.setProperty('--poem',rgba(mixc(ink,[255,255,255],.2,_c1)));
  let n=0;for(const l of LANT)if(l.lit>.3)n++;document.getElementById('cntTxt').textContent='灯 '+String(n).padStart(2,'0');}
let rafId=0,toId=0,manualDrive=false;
function frame(now){cancelAnimationFrame(rafId);clearTimeout(toId);if(!manualDrive){rafId=requestAnimationFrame(frame);toId=setTimeout(()=>frame(performance.now()),120);}
  const dt=Math.min(.05,(now-lastNow)/1000)||.016;lastNow=now;T+=dt;DT=dt;
  filterPointer(dt);updateWind(dt);updateLanterns(dt);updateRain(dt);updateCamera(dt);
  render();updateAudio();updateUI();if(running)updatePoem();}
function resetWorld(){initLanterns();CAMS.init=false;PLAN.length=0;planEnd=T;cycleNo=0;STA.clear();RIPPLES.length=0;STONES.length=0;RAIN.length=0;}
document.querySelectorAll('#intro .scene').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#intro .scene').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
  startStyle=parseInt(b.dataset.s,10);resetWorld();}));
let wakeLock=null;
async function keepAwake(){try{if('wakeLock' in navigator){wakeLock=await navigator.wakeLock.request('screen');}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&running)keepAwake();});
document.getElementById('start').addEventListener('click',()=>{
  const app=document.documentElement;
  try{const p=app.requestFullscreen?app.requestFullscreen({navigationUI:'hide'}):(app.webkitRequestFullscreen&&app.webkitRequestFullscreen());
    if(p&&p.then)p.then(()=>{try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}).catch(()=>{});}catch(e){}
  keepAwake();startAudio();document.getElementById('intro').classList.add('gone');running=true;POEM.at=T-1;setTimeout(resize,300);setTimeout(resize,1200);});
document.getElementById('btnMusic').addEventListener('click',toggleSound);
document.getElementById('btnPoem').addEventListener('click',togglePoem);
resize();initLanterns();bindInput();planEnd=0;lastNow=performance.now();frame(lastNow);
</script>
