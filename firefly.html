<!DOCTYPE html>

<style>
:root{--paper:#07080d;--ink:#b9bcc8;--ink-rgb:185,188,200;--poem:#c9ccd6;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

@media (orientation:portrait){
  #app{width:100vh;height:100vw;transform-origin:0 0;transform:translate(100vw,0) rotate(90deg);}
}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;cursor:crosshair;}

.ui{position:absolute;z-index:5;color:var(--ink);transition:color .8s linear;pointer-events:none;}

#hud .var{font-size:.62rem;opacity:.62;letter-spacing:.32em;margin-top:.15rem;font-family:"Helvetica Neue",Arial,sans-serif;}
#hud .var .mode{margin-left:1.2em;opacity:.8;}
#hud .var .sync{margin-left:1.2em;opacity:.9;font-variant-numeric:tabular-nums;}

.btn{pointer-events:auto;cursor:pointer;border:1px solid rgba(var(--ink-rgb),.5);color:var(--ink);background:rgba(7,8,13,.25);
  font:inherit;font-size:.72rem;letter-spacing:.18em;padding:.42rem .8rem .38rem;border-radius:999px;transition:background .3s,color .8s linear,border-color .8s linear,opacity .3s;backdrop-filter:blur(2px);}

#start:hover{background:#c9ccd6;color:#07080d;}

<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="vig"></div>
  <div id="hud" class="ui"><div class="shot"><span id="shotName">田上俯瞰</span><small id="shotEn">OVERHEAD</small></div><div class="var"><span id="varNo">VAR 01</span><span class="mode" id="modeTxt">AUTO</span><span class="sync" id="syncTxt">SYNC 00%</span></div></div>
  <div id="ctl" class="ui">
    <button class="btn" id="btnCam" title="切换镜头模式">镜头 · 自动</button>
    <button class="btn" id="btnPoem" title="诗句开关">诗</button>
    <button class="btn" id="btnMusic" title="声音开关">♪ 声音</button>
  </div>
  <div id="poem" class="ui"></div>
  <div id="intro">
    <div class="box">
      <h1>萤<small>FIREFLY</small></h1>
      <p>一条穿过夏夜的小路：稻田、竹林、村落、溪谷、荷塘。<br>几百只萤火虫各自闪烁，慢慢闪成同一个节拍。世界、镜头、声音与诗句全部程序化生成，永不重复。</p>
      <div class="scenes" id="scenes">
        <button class="scene sel" data-s="0"><i style="background:#2e3560"></i>稻田 · 暮</button>
        <button class="scene" data-s="1"><i style="background:#0c1020"></i>竹林 · 夜</button>
        <button class="scene" data-s="2"><i style="background:#2a3350"></i>村落 · 月</button>
        <button class="scene" data-s="3"><i style="background:#2a2f3a"></i>溪谷 · 雾</button>
        <button class="scene" data-s="4"><i style="background:#5a4a66"></i>荷塘 · 晨</button>
      </div>
      <button id="start">走进夜里 →</button>
      <div class="hint">鼠标是一支手电，照到的萤火会躲起来 · 点击闪一下，它们会跟上你的节拍 · 拖拽转镜头 · 滚轮缩放<br>选择出发的地方，之后沿同一条小路走下去</div>
    </div>
  </div>
</div>
<script>
'use strict';
/* ================= 基础工具 ================= */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{t=t<0?0:t>1?1:t;return t*t*(3-2*t);};
const smoother=t=>{t=t<0?0:t>1?1:t;return t*t*t*(t*(t*6-15)+10);};
function hash1(i){i=i|0;i=(i^61)^(i>>>16);i=Math.imul(i,9);i^=i>>>4;i=Math.imul(i,0x27d4eb2d);i^=i>>>15;return (i>>>0)/4294967296;}
function hash2(x,y){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)|0;h=(h^(h>>>13))|0;h=Math.imul(h,1274126177);return ((h^(h>>>16))>>>0)/4294967296;}
function hash3(x,y,z){return hash2(x|0,(y|0)+Math.imul(z|0,7919));}
function noise1(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash1(i),hash1(i+1),u);}
function noise2(x,y){const i=Math.floor(x),j=Math.floor(y),f=x-i,g=y-j,u=f*f*(3-2*f),v=g*g*(3-2*g);
  return lerp(lerp(hash2(i,j),hash2(i+1,j),u),lerp(hash2(i,j+1),hash2(i+1,j+1),u),v);}
function fbm1(x,o){let s=0,a=.5,f=1,n=0;for(let k=0;k<o;k++){s+=a*(noise1(x*f)-.5)*2;n+=a;a*=.5;f*=2.1;}return s/n;}
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};}
function hexc(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
const _tmpc=[0,0,0];
function mixc(a,b,t,o){o=o||_tmpc;o[0]=a[0]+(b[0]-a[0])*t;o[1]=a[1]+(b[1]-a[1])*t;o[2]=a[2]+(b[2]-a[2])*t;return o;}
function rgba(c,a){return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+(a===undefined?1:a)+')';}
function shade(c,k,o){o=o||_tmpc;o[0]=c[0]*k;o[1]=c[1]*k;o[2]=c[2]*k;return o;}

/* ================= 五种风格 = 五段夜路，各有各的钟点 ================= */
/* 0 稻田·暮 PADDY · 1 竹林·夜 BAMBOO · 2 村落·月 VILLAGE · 3 溪谷·雾 STREAM · 4 荷塘·晨 LOTUS */
/* 黑纸上的白描：地物用淡墨线，萤火是唯一的暖光 */
const STYLE_NAMES=['稻田 PADDY','竹林 BAMBOO','村落 VILLAGE','溪谷 STREAM','荷塘 LOTUS'];
const PAL_SRC=[
{ skyTop:'#141a36',skyHor:'#2b3462',fog:'#1a2040',ground:'#0d1122',water:'#182042',ink:'#5c6488',inkLo:'#333a58',fly:'#d2f26e',flyHi:'#f6ffd0',window:'#ffcf7a',moon:'#e8ecf5',glow:'#3a4478',ui:'#b9bcc8',
  fogDist:1500,star:.35,moon:0,mist:.1,dawn:0,paddy:1,bamboo:.15,village:.25,stream:0,lotus:0,flyD:1,windows:.6,cricket:.8,frog:1,root:40,glowAmt:.3 },
{ skyTop:'#04050b',skyHor:'#0c1020',fog:'#080a14',ground:'#05060c',water:'#0a0d1a',ink:'#4a4f60',inkLo:'#262a38',fly:'#dcf585',flyHi:'#fbffd8',window:'#ffc46a',moon:'#e8ecf5',glow:'#141a30',ui:'#b0b4c0',
  fogDist:900,star:1,moon:0,mist:0,dawn:0,paddy:0,bamboo:1,village:0,stream:.2,lotus:0,flyD:1.15,windows:0,cricket:1,frog:.2,root:38,glowAmt:0 },
{ skyTop:'#0c1224',skyHor:'#2a3352',fog:'#161d34',ground:'#0a0e1a',water:'#151d36',ink:'#6a7290',inkLo:'#3a4058',fly:'#ffe070',flyHi:'#fff6d0',window:'#ffc26b',moon:'#f3f5fa',glow:'#2a3458',ui:'#c2c6d2',
  fogDist:1800,star:.6,moon:1,mist:0,dawn:0,paddy:.2,bamboo:.1,village:1,stream:.1,lotus:0,flyD:.8,windows:1,cricket:.7,frog:.3,root:43,glowAmt:.15 },
{ skyTop:'#121620',skyHor:'#2a2f3a',fog:'#1d222c',ground:'#0b0e15',water:'#141a24',ink:'#585e6c',inkLo:'#30353f',fly:'#c8ee8a',flyHi:'#eefad4',window:'#ffd18a',moon:'#e8ecf5',glow:'#262c38',ui:'#b4b8c0',
  fogDist:520,star:.08,moon:0,mist:1,dawn:0,paddy:0,bamboo:.3,village:.1,stream:1,lotus:0,flyD:.9,windows:.2,cricket:.5,frog:.5,root:36,glowAmt:0 },
{ skyTop:'#2a2742',skyHor:'#5a4a66',fog:'#372f48',ground:'#14121e',water:'#2a2540',ink:'#665e78',inkLo:'#3a3450',fly:'#eeee8a',flyHi:'#ffffe0',window:'#ffd9a0',moon:'#efeaf3',glow:'#5a4a6a',ui:'#c4bccc',
  fogDist:1400,star:.15,moon:0,mist:.3,dawn:1,paddy:.2,bamboo:0,village:.1,stream:.2,lotus:1,flyD:.55,windows:.1,cricket:.3,frog:.8,root:45,glowAmt:.9 }
];
const PAL=PAL_SRC.map(p=>{const o={};for(const k in p){const v=p[k];o[k]=typeof v==='string'?hexc(v):v;}return o;});
const COLKEYS=Object.keys(PAL[0]).filter(k=>Array.isArray(PAL[0][k]));
const NUMKEYS=Object.keys(PAL[0]).filter(k=>typeof PAL[0][k]==='number');
/* 风格锋面：沿 +X 每段 SEG，锋面按 y 参差，过渡带宽 BAND。走路很慢，所以段短 */
const SEG=1800,BAND=500;
let startStyle=0;
function styleIdx(k){return (((startStyle+k)%5)+5)%5;}
function frontOffset(k,y){return 120*(noise1(y/300+k*7.31)-.5)*2+50*(noise1(y/90+k*3.7+9)-.5)*2;}
function styleAt(x,y,o){o=o||{a:0,b:0,t:0};const k=Math.floor(x/SEG);
  const d0=x-(k*SEG+frontOffset(k-1,y));const t0=smooth((d0+BAND*.5)/BAND);
  if(t0<1){o.a=styleIdx(k-1);o.b=styleIdx(k);o.t=t0;return o;}
  const d1=x-((k+1)*SEG+frontOffset(k,y));o.a=styleIdx(k);o.b=styleIdx(k+1);o.t=smooth((d1+BAND*.5)/BAND);return o;}
function blendPal(s,o){o=o||{};const A=PAL[s.a],B=PAL[s.b],t=s.t;
  for(const k of COLKEYS){o[k]=mixc(A[k],B[k],t,o[k]||[0,0,0]);}
  for(const k of NUMKEYS){o[k]=lerp(A[k],B[k],t);}
  o.a=s.a;o.b=s.b;o.t=t;return o;}
const _sc={a:0,b:0,t:0};
function colAt(key,x,y,o){styleAt(x,y,_sc);return mixc(PAL[_sc.a][key],PAL[_sc.b][key],_sc.t,o);}
function numAt(key,x,y){styleAt(x,y,_sc);return lerp(PAL[_sc.a][key],PAL[_sc.b][key],_sc.t);}
function fogT(d,dist){const t=(d-dist*.15)/(dist*1.1);return t<=0?0:Math.min(.96,1-Math.exp(-t*t*2.4));}

/* ================= 相机与投影 ================= */
let W=800,H=600,DPR=1,ctx=null,T=0;
const CAM={x:0,y:0,z:200,yaw:0,pitch:.9,fov:1.0,focal:600,pcx:400,pcy:300,fx:1,fy:0,fz:0,rx:0,ry:-1,rz:0,ux:0,uy:0,uz:1};
const NEAR=2;
function camPrep(){const cy=Math.cos(CAM.yaw),sy=Math.sin(CAM.yaw),cp=Math.cos(CAM.pitch),sp=Math.sin(CAM.pitch);
  CAM.fx=cy*cp;CAM.fy=sy*cp;CAM.fz=-sp;CAM.rx=sy;CAM.ry=-cy;CAM.rz=0;CAM.ux=cy*sp;CAM.uy=sy*sp;CAM.uz=cp;
  let f=H*.5/Math.tan(CAM.fov*.5);const maxH=W*.5/Math.tan(.87);if(f<maxH)f=maxH;CAM.focal=f;
  CAM.pcx=W*.45;CAM.pcy=H*.52;}
const CS=new Float64Array(120),CP=new Float64Array(120);
function toCam(x,y,z,o,i){const dx=x-CAM.x,dy=y-CAM.y,dz=z-CAM.z;o[i]=dx*CAM.rx+dy*CAM.ry;o[i+1]=dx*CAM.ux+dy*CAM.uy+dz*CAM.uz;o[i+2]=dx*CAM.fx+dy*CAM.fy+dz*CAM.fz;}
function clipNear(src,n,dst){let m=0;for(let k=0;k<n;k++){const a=k*3,b=((k+1)%n)*3,az=src[a+2],bz=src[b+2],ain=az>NEAR,bin=bz>NEAR;
  if(ain){dst[m]=src[a];dst[m+1]=src[a+1];dst[m+2]=az;m+=3;}
  if(ain!==bin){const t=(NEAR-az)/(bz-az);dst[m]=src[a]+(src[b]-src[a])*t;dst[m+1]=src[a+1]+(src[b+1]-src[a+1])*t;dst[m+2]=NEAR;m+=3;}}
  return m/3;}
let PB_x0=0,PB_y0=0,PB_x1=0,PB_y1=0;
function pathPoly(p,n,open){let allIn=true,anyIn=false;
  for(let k=0;k<n;k++){toCam(p[k*3],p[k*3+1],p[k*3+2],CS,k*3);if(CS[k*3+2]>NEAR)anyIn=true;else allIn=false;}
  if(!anyIn)return false;let src=CS,m=n;if(!allIn){if(open)return false;m=clipNear(CS,n,CP);src=CP;if(m<3)return false;}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;ctx.beginPath();
  for(let k=0;k<m;k++){const z=src[k*3+2],s=CAM.focal/z,sx=CAM.pcx+src[k*3]*s,sy=CAM.pcy-src[k*3+1]*s;
    if(k)ctx.lineTo(sx,sy);else ctx.moveTo(sx,sy);if(sx<x0)x0=sx;if(sx>x1)x1=sx;if(sy<y0)y0=sy;if(sy>y1)y1=sy;}
  if(!open)ctx.closePath();PB_x0=x0;PB_y0=y0;PB_x1=x1;PB_y1=y1;return !(x1<0||x0>W||y1<0||y0>H);}
const PP={sx:0,sy:0,d:0,s:0};
function projPt(x,y,z,o){o=o||PP;const dx=x-CAM.x,dy=y-CAM.y,dz=z-CAM.z;const d=dx*CAM.fx+dy*CAM.fy+dz*CAM.fz;if(d<=NEAR){o.d=d;return false;}
  const s=CAM.focal/d;o.sx=CAM.pcx+(dx*CAM.rx+dy*CAM.ry)*s;o.sy=CAM.pcy-(dx*CAM.ux+dy*CAM.uy+dz*CAM.uz)*s;o.d=d;o.s=s;return true;}
function camDist(x,y,z){const dx=x-CAM.x,dy=y-CAM.y,dz=z-CAM.z;return Math.sqrt(dx*dx+dy*dy+dz*dz);}
function horizonY(){return CAM.pcy-CAM.focal*Math.tan(CAM.pitch);}
/* 月亮方向：低挂在路的左前方 */
const MOON={az:.9,el:.38,x:0,y:0,z:0};MOON.x=Math.cos(MOON.el)*Math.cos(MOON.az);MOON.y=Math.cos(MOON.el)*Math.sin(MOON.az);MOON.z=Math.sin(MOON.el);
/* ================= 每帧调色板 ================= */
const SC={a:0,b:0,t:0},SF={a:0,b:0,t:0};
const PC=blendPal(styleAt(0,0,SC)),PF=blendPal(styleAt(0,0,SF));
let glowAmt=0,frontT=0;
const _c1=[0,0,0],_c2=[0,0,0],_c3=[0,0,0],_c4=[0,0,0];
function fogCol(c,d,o){return mixc(c,PC.fog,fogT(d,PC.fogDist),o);}

/* ================= 夜路两侧的世界：黑纸白描 ================= */
const IS_TOUCH=matchMedia('(pointer: coarse)').matches;
function routeY(x){return 120*Math.sin(x/900)+45*Math.sin(x/310+1.1);}
function streamY(x){return routeY(x)+120*Math.sin(x/700)+30*Math.sin(x/160+2);}
function streamHalf(x){return 15+6*Math.sin(x/430+1);}
const CELLS=new Map();const CS_=300;
function getCell(i,j){const key=i*100003+j;let c=CELLS.get(key);if(c)return c;if(CELLS.size>400)CELLS.clear();
  const R=rng((Math.imul(i,73856093)^Math.imul(j,19349663))>>>0);const cx=(i+.5)*CS_,cy=(j+.5)*CS_;
  const paddy=numAt('paddy',cx,cy),bamboo=numAt('bamboo',cx,cy),village=numAt('village',cx,cy),stream=numAt('stream',cx,cy),lotus=numAt('lotus',cx,cy);
  c={paddy:false,dykes:[],bamboo:[],houses:[],trees:[],ponds:[],reeds:[],stones:[],grass:[]};CELLS.set(key,c);
  const ry=routeY(cx);const nearPath=Math.abs(cy-ry)<70;
  // 稻田：整格是水，田埂把它分成不规则的块
  if(R()<paddy*.95&&!nearPath){c.paddy=true;const n=2+Math.floor(R()*3);let x=i*CS_;
    for(let k=0;k<n;k++){const w=CS_/n;const jx=(R()-.5)*30;c.dykes.push({x0:x+w+jx,y0:j*CS_,x1:x+w-jx,y1:(j+1)*CS_});x+=w;}
    const m=1+Math.floor(R()*2);for(let k=1;k<=m;k++){const y=j*CS_+k*CS_/(m+1)+(R()-.5)*40;c.dykes.push({x0:i*CS_,y0:y,x1:(i+1)*CS_,y1:y+(R()-.5)*40});}}
  // 竹丛
  const nb=Math.floor(bamboo*(2+R()*5));for(let k=0;k<nb;k++){const x=i*CS_+R()*CS_,y=j*CS_+R()*CS_;if(Math.abs(y-routeY(x))<24)continue;const st=[];

function inPond(c,x,y){for(const p of c.ponds){const dx=x-p.x,dy=y-p.y;if(dx*dx+dy*dy<p.r*p.r)return true;}return false;}

const STARS=[];for(let i=0;i<220;i++){const az=hash1(i*3+1)*TAU,el=.05+hash1(i*3+2)*1.4;STARS.push({dx:Math.cos(az)*Math.cos(el),dy:Math.sin(az)*Math.cos(el),dz:Math.sin(el),s:.5+hash1(i*3+3)*1.4,ph:hash1(i*7)*TAU,f:.4+hash1(i*11)*1.4});}

  for(const s of STARS){const d=s.dx*CAM.fx+s.dy*CAM.fy+s.dz*CAM.fz;if(d<.05)continue;const k=CAM.focal/d;

const RGP=new Float64Array(48);
function drawPathAndStream(x0,x1){

      if(projPt(x+3,ya+off+sh,.2,PP)){const sx=PP.sx,sy=PP.sy;if(projPt(x+21,yb+off+sh,.2,PP)){ctx.strokeStyle=rgba(fogCol(PC.ink,dd,_c2),.35*sw);ctx.lineWidth=Math.max(.5,Math.min(1.3,PP.s*1.2));ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(PP.sx,PP.sy);ctx.stroke();}}}}}
/* 石桥：小路跨溪的地方 */

const BRP=new Float64Array(60);
function drawBridge(x,dd){const y=routeY(x);const half=streamHalf(x)+14;const h=12;const ang=Math.atan((routeY(x+8)-routeY(x-8))/16);const c=Math.cos(ang),s=Math.sin(ang);

function drawBamboo(b,dd){const sc0=CAM.focal/Math.max(NEAR,dd);if(sc0*60<3)return;fogCol(PC.ink,dd,_c1);const fogt=fogT(dd,PC.fogDist);

const HV=new Float64Array(36),FACE=new Float64Array(15);

  for(let k=-1;k<=1;k++){ctx.moveTo(PP.sx,PP.sy);ctx.lineTo(PP.sx+(k*.5+sw)*s,PP.sy-s*(1.2-Math.abs(k)*.3));}ctx.stroke();}

/* 收集：地面装饰直接由远到近画；立体物进排序表 */

  for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){const cx=(i+.5)*CS_,cy=(j+.5)*CS_;const d=camDist(cx,cy,0);if(d>PC.fogDist*1.25+300)continue;CELLQ.push({i,j,c:getCell(i,j),d});}
  CELLQ.sort((a,b)=>b.d-a.d);}
function collectWorld(){for(const q of CELLQ){const c=q.c;
    for(const b of c.bamboo){const dd=camDist(b.x,b.y,30);if(dd<PC.fogDist*1.2)dlPush(dd,1,b);}

/* ================= 萤火虫：几百个互相拉扯的振子 ================= */
/* 每只有自己的相位与固有频率；邻居之间按 Kuramoto 模型互相拉扯，慢慢闪成同一拍。
   手电照到的会熄灭并打乱相位；你闪一下，附近的会跟着闪 */
const NF=IS_TOUCH?320:700;
const FL={x:0,y:0,z:22,speed:9};const FC={x:0,y:0,z:22};
const FX=new Float64Array(NF),FY=new Float64Array(NF),FZ=new Float64Array(NF),VX=new Float64Array(NF),VY=new Float64Array(NF),VZ=new Float64Array(NF),
      PH=new Float64Array(NF),OM=new Float64Array(NF),BR=new Float64Array(NF),ON=new Uint8Array(NF),SD=new Float64Array(NF),WT=new Uint8Array(NF),LAST=new Float64Array(NF);
const KUR={K:.85,R:64,sync:0,dens:0,flashes:0,nAct:NF};
function spawnFly(i,ahead){const R=Math.random;FX[i]=FL.x+(ahead?220+R()*320:-200+R()*640);FY[i]=routeY(FX[i])+(R()-.5)*(R()<.25?520:300);FZ[i]=2+45*Math.pow(R(),2.2);VX[i]=0;VY[i]=0;VZ[i]=0;
  PH[i]=R()*TAU;OM[i]=TAU/(1.7+R()*.6);BR[i]=0;ON[i]=1;SD[i]=R()*100;LAST[i]=-10;WT[i]=isWater(FX[i],FY[i])?1:0;}
function initFlies(){FL.x=SEG*.5+100;FL.y=routeY(FL.x);FC.x=FL.x;FC.y=FL.y;KUR.sync=0;for(let i=0;i<NF;i++)spawnFly(i,false);}
const GRID=new Map();const GS=70;let frameNo=0;
function gkey(gx,gy){return gx*73856+gy;}
function updateFlies(dt){frameNo++;
  FL.x+=FL.speed*dt;const ty=routeY(FL.x);FL.y+=(ty-FL.y)*Math.min(1,dt*1.2);
  const kc=Math.min(1,dt*1.5);FC.x+=(FL.x-FC.x)*kc;FC.y+=(FL.y-FC.y)*kc;FC.z=FL.z;
  const dens=numAt('flyD',FL.x,FL.y);const nAct=Math.round(NF*clamp(dens,.3,1.15));KUR.nAct=Math.min(NF,nAct);
  GRID.clear();for(let i=0;i<NF;i++){const k=gkey(Math.floor(FX[i]/GS),Math.floor(FY[i]/GS));let a=GRID.get(k);if(!a){a=[];GRID.set(k,a);}a.push(i);}
  const beam=BEAM.active&&T>BEAM.suppress;const bx=CAM.x,by=CAM.y,bz=CAM.z;const ax=BEAM.ax,ay=BEAM.ay,az=BEAM.az;
  KUR.flashes=0;let sx=0,sy=0,sn=0;const R2=KUR.R*KUR.R;
  for(let i=0;i<NF;i++){
    const s=SD[i];const nx=T*.35+s;VX[i]+=((fbm1(nx,2)*9)-VX[i])*dt*1.2;VY[i]+=((fbm1(nx+7,2)*9)-VY[i])*dt*1.2;VZ[i]+=((fbm1(nx+13,2)*5-(FZ[i]-14)*.04)-VZ[i])*dt*1.2;
    FX[i]+=VX[i]*dt;FY[i]+=VY[i]*dt;FZ[i]+=VZ[i]*dt;if(FZ[i]<1.5){FZ[i]=1.5;VZ[i]=Math.abs(VZ[i]);}if(FZ[i]>70){FZ[i]=70;VZ[i]=-Math.abs(VZ[i]);}
    if(FX[i]<FL.x-330||Math.abs(FY[i]-routeY(FX[i]))>300){spawnFly(i,true);continue;}
    if(((i*7+frameNo)%120)===0)WT[i]=isWater(FX[i],FY[i])?1:0;
    if(i>=KUR.nAct){BR[i]*=Math.exp(-dt*3);continue;}
    let lit=false;
    if(beam){const dx=FX[i]-bx,dy=FY[i]-by,dz=FZ[i]-bz;const d=Math.sqrt(dx*dx+dy*dy+dz*dz);if(d<520&&d>1){const cosang=(dx*ax+dy*ay+dz*az)/d;if(cosang>.982)lit=true;}}
    if(lit){ON[i]=0;BR[i]*=Math.exp(-dt*12);continue;}
    else if(!ON[i]){ON[i]=1;PH[i]=Math.random()*TAU;}
    let sum=0,n=0;const gx=Math.floor(FX[i]/GS),gy=Math.floor(FY[i]/GS);
    for(let ox=-1;ox<=1&&n<28;ox++)for(let oy=-1;oy<=1&&n<28;oy++){const a=GRID.get(gkey(gx+ox,gy+oy));if(!a)continue;
      for(const j of a){if(j===i||j>=KUR.nAct||!ON[j])continue;const dx=FX[j]-FX[i],dy=FY[j]-FY[i],dz=FZ[j]-FZ[i];if(dx*dx+dy*dy+dz*dz>R2)continue;sum+=Math.sin(PH[j]-PH[i]);n++;if(n>=28)break;}}
    PH[i]+=(OM[i]+(n?KUR.K*sum/n:0))*dt;
    if(PH[i]>=TAU){PH[i]-=TAU;BR[i]=1;KUR.flashes++;LAST[i]=T;onFlash(i);}
    BR[i]*=Math.exp(-dt/(.55+.35*KUR.sync));
    const ddx=FX[i]-FC.x,ddy=FY[i]-FC.y;if(ddx*ddx+ddy*ddy<62500){sx+=Math.cos(PH[i]);sy+=Math.sin(PH[i]);sn++;}}
  const r=sn?Math.hypot(sx,sy)/sn:0;KUR.sync+=(r-KUR.sync)*Math.min(1,dt*.8);
  KUR.dens+=(KUR.flashes/Math.max(1,KUR.nAct)/Math.max(.004,dt)-KUR.dens)*Math.min(1,dt*8);}
/* 你闪一下：附近的相位被拉到"马上要亮"，随后一圈圈跟着亮；手电同时暗一会儿 */
const FLASH={t:-10,x:0,y:0};
function userFlash(){FLASH.t=T;FLASH.x=BEAM.gx;FLASH.y=BEAM.gy;BEAM.suppress=T+1.4;
  for(let i=0;i<NF;i++){const dx=FX[i]-FLASH.x,dy=FY[i]-FLASH.y;const d2=dx*dx+dy*dy;if(d2<170*170){const k=1-Math.sqrt(d2)/170;PH[i]=lerp(PH[i],TAU-.1-Math.random()*.2*(1.2-k),.92*k);ON[i]=1;}}
  flashSound();}
/* 画：辉光精灵，加法叠色；水面上有倒影 */
let SPR=null;const SPRC=[-1,0,0];
function makeSprite(col,hi){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const gr=g.createRadialGradient(32,32,0,32,32,32);const h2=mixc(col,hi,.45,[0,0,0]);
  gr.addColorStop(0,rgba(h2,1));gr.addColorStop(.05,rgba(col,1));gr.addColorStop(.18,rgba(col,.6));gr.addColorStop(.45,rgba(col,.2));gr.addColorStop(1,rgba(col,0));g.fillStyle=gr;g.fillRect(0,0,64,64);return c;}
function drawFlies(){if(!SPR||Math.abs(SPRC[0]-PC.fly[0])+Math.abs(SPRC[1]-PC.fly[1])+Math.abs(SPRC[2]-PC.fly[2])>6){SPR=makeSprite(PC.fly,PC.flyHi);SPRC[0]=PC.fly[0];SPRC[1]=PC.fly[1];SPRC[2]=PC.fly[2];}
  ctx.save();ctx.globalCompositeOperation='lighter';
  const big=1+.5*KUR.sync;
  for(let i=0;i<KUR.nAct;i++){if(!projPt(FX[i],FY[i],FZ[i],PP))continue;const b=Math.max(BR[i],PP.d<320?.1:0);if(b<.02)continue;const fog=1-fogT(PP.d,PC.fogDist);if(fog<.03)continue;
    const sz=clamp((3.5+12*b*big)*PP.s,5,70);const a=(.08+.92*b)*fog;ctx.globalAlpha=a;ctx.drawImage(SPR,PP.sx-sz*.5,PP.sy-sz*.5,sz,sz);
    ctx.globalAlpha=a*.95;ctx.fillStyle=rgba(b>.5?PC.flyHi:PC.fly);ctx.beginPath();ctx.arc(PP.sx,PP.sy,Math.max(.9,sz*.075),0,TAU);ctx.fill();
    if(b>.12&&WT[i]&&projPt(FX[i],FY[i],-FZ[i]*.9,PP)){const sz2=sz*.9;ctx.globalAlpha=a*.38;ctx.drawImage(SPR,PP.sx-sz2*.5,PP.sy-sz2*.55,sz2,sz2*1.3);}}
  // 你的闪：一团很快散开的光
  const age=T-FLASH.t;if(age>=0&&age<.7&&projPt(FLASH.x,FLASH.y,3,PP)){const R=(20+age*160)*PP.s;const a=(1-age/.7)*.6;const g=ctx.createRadialGradient(PP.sx,PP.sy,0,PP.sx,PP.sy,R);g.addColorStop(0,rgba(PC.flyHi,a));g.addColorStop(.4,rgba(PC.fly,a*.35));g.addColorStop(1,rgba(PC.fly,0));ctx.globalAlpha=1;ctx.fillStyle=g;ctx.fillRect(PP.sx-R,PP.sy-R,R*2,R*2);}
  ctx.restore();ctx.globalAlpha=1;}

/* ================= 镜头：无剪辑自动运镜 ================= */

function mkPose(){return {px:0,py:0,pz:100,tx:0,ty:0,tz:18,fov:1};}

const byEn=n=>SHOTS.find(s=>s.en===n);
const SLOTS=['top','desc','mid','climax','rise'];
const PLAN=[];let cycleNo=0;let planEnd=0;const lastPick={};
const _pa=mkPose();
function shotYaw(sh,o){sh.f(0,o,_pa);const dx=_pa.tx-_pa.px,dy=_pa.ty-_pa.py;const pitch=Math.atan2(_pa.pz-_pa.tz,Math.hypot(dx,dy));return {yaw:Math.atan2(dy,dx),top:Math.abs(pitch)>1.2};}
function yawDiff(a,b){let d=Math.abs(a-b)%TAU;return d>Math.PI?TAU-d:d;}
function planCycle(){cycleNo++;const hi=cycleNo%2===1;const R=rng(cycleNo*9973+startStyle*31+7);let prev=PLAN.length?PLAN[PLAN.length-1]:null;
  const stream=PF.stream>.4,village=PF.village>.4;
  const moon=PF.moon>.3;
  for(const cat of SLOTS){let pool=SHOTS.filter(s=>s.cat===cat&&(!s.stream||stream)&&(!s.village||village)&&(!s.moon||moon));
    if(cat==='top'||cat==='desc'){const p2=pool.filter(s=>(s.hi===1)===hi);if(p2.length)pool=p2;}
    if(cat==='climax'){pool=KUR.sync>.55&&cycleNo%2===0?[byEn('FLASH WAVE')]:[byEn(cycleNo%2===0||!moon?'UPWARD':'UNDER MOON')];}
    else if(pool.length>1&&lastPick[cat]!==undefined){const alt=pool.filter(s=>s!==lastPick[cat]);if(alt.length)pool=alt;}
    const dcard=[.78,1,1.4][Math.floor(R()*3)]*(hi?1.15:.9);let best=null;

  DPR=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx=cv.getContext('2d');ctx.setTransform(DPR,0,0,DPR,0,0);grainPat=null;}

let uiTick=0;
function updateUI(){uiTick++;if(uiTick%6)return;const ink=PC.ui;root.style.setProperty('--ink',rgba(ink));root.style.setProperty('--ink-rgb',(ink[0]|0)+','+(ink[1]|0)+','+(ink[2]|0));root.style.setProperty('--poem',rgba(mixc(ink,[255,255,255],.25,_c1)));
  document.getElementById('syncTxt').textContent='SYNC '+String(Math.round(KUR.sync*100)).padStart(2,'0')+'%';}
let rafId=0,toId=0,manualDrive=false;
function frame(now){cancelAnimationFrame(rafId);clearTimeout(toId);if(!manualDrive){rafId=requestAnimationFrame(frame);toId=setTimeout(()=>frame(performance.now()),120);}
  const dt=Math.min(.05,(now-lastNow)/1000)||.016;lastNow=now;T+=dt;DT=dt;
  filterPointer(dt);updateBeam(dt);updateFlies(dt);updateCamera(dt);
  render();updateAudio();updateUI();if(running)updatePoem();}
function resetWorld(){initFlies();CAMS.init=false;PLAN.length=0;planEnd=T;cycleNo=0;CELLS.clear();FLASH.t=-10;}
document.querySelectorAll('#intro .scene').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#intro .scene').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
  startStyle=parseInt(b.dataset.s,10);resetWorld();}));
let wakeLock=null;
async function keepAwake(){try{if('wakeLock' in navigator){wakeLock=await navigator.wakeLock.request('screen');}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&running)keepAwake();});
document.getElementById('start').addEventListener('click',()=>{
  const app=document.documentElement;
  try{const p=app.requestFullscreen?app.requestFullscreen({navigationUI:'hide'}):(app.webkitRequestFullscreen&&app.webkitRequestFullscreen());
    if(p&&p.then)p.then(()=>{try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}).catch(()=>{});}catch(e){}
  keepAwake();startAudio();document.getElementById('intro').classList.add('gone');running=true;POEM.at=T-1;setTimeout(resize,300);setTimeout(resize,1200);});
document.getElementById('btnMusic').addEventListener('click',toggleSound);
document.getElementById('btnPoem').addEventListener('click',togglePoem);
resize();initFlies();bindInput();planEnd=0;lastNow=performance.now();frame(lastNow);
</script>
</body>
