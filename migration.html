<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<title>候鸟 · MIGRATION</title>
<style>
:root{--paper:#f6f2e9;--ink:#3a362c;--ink-rgb:58,54,44;--poem:#3a362c;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{font-size:16px;}
@media (min-width:2200px){html{font-size:24px;}}
@media (min-width:3200px){html{font-size:32px;}}
html,body{margin:0;height:100%;background:var(--paper);overflow:hidden;overscroll-behavior:none;}
body{font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","PingFang SC",Georgia,serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;}
#app{position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:hidden;background:var(--paper);}
@media (orientation:portrait){
  #app{width:100vh;height:100vw;transform-origin:0 0;transform:translate(100vw,0) rotate(90deg);}
}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;cursor:crosshair;}
#cv.grab{cursor:grab;}
#cv.grabbing{cursor:grabbing;}
.ui{position:absolute;z-index:5;color:var(--ink);transition:color .8s linear;pointer-events:none;}
#hud{left:1.6rem;top:1.3rem;letter-spacing:.12em;line-height:1.5;}
#hud .shot{font-size:1.05rem;}
#hud .shot small{font-size:.62rem;opacity:.72;margin-left:.6em;letter-spacing:.2em;}
#hud .var{font-size:.62rem;opacity:.62;letter-spacing:.32em;margin-top:.15rem;font-family:"Helvetica Neue",Arial,sans-serif;}
#hud .var .mode{margin-left:1.2em;opacity:.8;}
#ctl{right:1.4rem;top:1.15rem;display:flex;gap:.45rem;pointer-events:auto;}
.btn{pointer-events:auto;cursor:pointer;border:1px solid rgba(var(--ink-rgb),.55);color:var(--ink);background:rgba(246,242,233,.18);
  font:inherit;font-size:.72rem;letter-spacing:.18em;padding:.42rem .8rem .38rem;border-radius:999px;transition:background .3s,color .8s linear,border-color .8s linear,opacity .3s;backdrop-filter:blur(2px);}
.btn:hover{background:rgba(var(--ink-rgb),.1);}
.btn.off{opacity:.42;}
.btn.off span.dot{text-decoration:line-through;}
#poem{right:5.5%;top:50%;width:33%;max-width:26rem;transform:translateY(-50%);color:var(--poem);transition:color 1.2s linear;opacity:1;}
#poem.hidden{display:none;}
#poem .t{font-size:.78rem;letter-spacing:.42em;opacity:.7;margin-bottom:.9rem;}
#poem .rule{height:1px;background:currentColor;opacity:.55;transform-origin:left center;transform:scaleX(0);transition:transform 2.4s cubic-bezier(.2,.7,.2,1);margin-bottom:1.1rem;width:70%;}
#poem.on .rule{transform:scaleX(1);}
#poem .l{font-size:1.28rem;line-height:2.05;letter-spacing:.2em;}
#poem .c{opacity:0;transition:opacity 1.1s ease;display:inline-block;transform:translateY(.15em);}
#poem.on .c{opacity:1;transform:none;transition:opacity 1.1s ease,transform 1.4s cubic-bezier(.2,.7,.2,1);}
#poem.fade .c,#poem.fade .t{opacity:0;transition:opacity 2.2s ease;}
#poem.fade .rule{transform:scaleX(0);transition:transform 2.6s ease;}
#poem .t{transition:opacity 1.4s ease;}
#intro{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 45%,rgba(255,252,246,.55),rgba(246,242,233,.92) 70%);transition:opacity 1.6s ease;}
#intro.gone{opacity:0;pointer-events:none;}
#intro .box{text-align:center;color:#3a362c;max-width:36rem;padding:2rem 1.5rem;}
#intro h1{font-weight:400;font-size:2.6rem;letter-spacing:.42em;margin:0 0 .35rem;text-indent:.42em;}
#intro h1 small{display:block;font-size:.72rem;letter-spacing:.62em;opacity:.6;margin-top:.5rem;font-family:"Helvetica Neue",Arial,sans-serif;text-indent:.62em;}
#intro p{font-size:.78rem;letter-spacing:.2em;opacity:.7;line-height:1.9;margin:1.4rem 0 1.1rem;}
#intro .scenes{display:flex;justify-content:center;gap:.55rem;flex-wrap:wrap;margin-bottom:1.6rem;}
#intro .scene{cursor:pointer;border:1px solid rgba(58,54,44,.35);border-radius:999px;padding:.4rem .95rem;font-size:.74rem;letter-spacing:.22em;background:transparent;font:inherit;color:#3a362c;transition:all .3s;display:flex;align-items:center;gap:.45em;}
#intro .scene i{display:inline-block;width:.7em;height:.7em;border-radius:50%;border:1px solid rgba(58,54,44,.3);}
#intro .scene.sel{background:#3a362c;color:#f6f2e9;border-color:#3a362c;}
#intro .scene.sel i{border-color:rgba(246,242,233,.5);}
#start{cursor:pointer;font:inherit;font-size:1.05rem;letter-spacing:.32em;padding:.85rem 2.2rem .8rem 2.5rem;border:1px solid #3a362c;background:transparent;color:#3a362c;border-radius:999px;transition:all .35s;}
#start:hover{background:#3a362c;color:#f6f2e9;}
#intro .hint{font-size:.62rem;letter-spacing:.28em;opacity:.5;margin-top:1.6rem;line-height:2;}
#vig{position:absolute;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(58,54,44,.10) 100%);mix-blend-mode:multiply;}

<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="vig"></div>
  <div id="hud" class="ui"><div class="shot"><span id="shotName">正俯视</span><small id="shotEn">TOP DOWN</small></div><div class="var"><span id="varNo">VAR 01</span><span class="mode" id="modeTxt">AUTO</span></div></div>
  <div id="ctl" class="ui">
    <button class="btn" id="btnCam" title="切换镜头模式">镜头 · 自动</button>
    <button class="btn" id="btnPoem" title="诗句开关">诗</button>
    <button class="btn" id="btnMusic" title="音乐开关">♪ 音乐</button>
  </div>
  <div id="poem" class="ui"></div>
  <div id="intro">
    <div class="box">
      <h1>候鸟<small>MIGRATION</small></h1>
      <p>一群纸鸟沿一条无限延伸的航线飞行。<br>世界、镜头、音乐与诗句全部程序化生成，永不重复。</p>
      <div class="scenes" id="scenes">
        <button class="scene sel" data-s="0"><i style="background:#e9d9b4"></i>暖纸</button>
        <button class="scene" data-s="2"><i style="background:#e6b8b8"></i>暮粉</button>
        <button class="scene" data-s="4"><i style="background:#2c3550"></i>夜航</button>
        <button class="scene" data-s="1"><i style="background:#cfd3d0"></i>雾</button>
        <button class="scene" data-s="3"><i style="background:#eef0f2"></i>雪</button>
      </div>
      <button id="start">开始迁徙 →</button>
      <div class="hint">鼠标即是风 · 拖拽转镜头 · 滚轮缩放<br>选择起飞地点，之后沿同一航线飞行</div>
    </div>
  </div>
</div>
<script>
'use strict';
/* ================= 基础工具 ================= */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{t=t<0?0:t>1?1:t;return t*t*(3-2*t);};
const smoother=t=>{t=t<0?0:t>1?1:t;return t*t*t*(t*(t*6-15)+10);};
function hash1(i){i=i|0;i=(i^61)^(i>>>16);i=Math.imul(i,9);i^=i>>>4;i=Math.imul(i,0x27d4eb2d);i^=i>>>15;return (i>>>0)/4294967296;}
function hash2(x,y){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)|0;h=(h^(h>>>13))|0;h=Math.imul(h,1274126177);return ((h^(h>>>16))>>>0)/4294967296;}
function hash3(x,y,z){return hash2(x|0,(y|0)+Math.imul(z|0,7919));}
function noise1(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash1(i),hash1(i+1),u);}
function noise2(x,y){const i=Math.floor(x),j=Math.floor(y),f=x-i,g=y-j,u=f*f*(3-2*f),v=g*g*(3-2*g);
  return lerp(lerp(hash2(i,j),hash2(i+1,j),u),lerp(hash2(i,j+1),hash2(i+1,j+1),u),v);}
function fbm1(x,o){let s=0,a=.5,f=1,n=0;for(let k=0;k<o;k++){s+=a*(noise1(x*f)-.5)*2;n+=a;a*=.5;f*=2.1;}return s/n;}
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};}
/* 颜色：[r,g,b] */
function hexc(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
const _tmpc=[0,0,0];
function mixc(a,b,t,o){o=o||_tmpc;o[0]=a[0]+(b[0]-a[0])*t;o[1]=a[1]+(b[1]-a[1])*t;o[2]=a[2]+(b[2]-a[2])*t;return o;}
function rgba(c,a){return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+(a===undefined?1:a)+')';}
function shade(c,k,o){o=o||_tmpc;o[0]=c[0]*k;o[1]=c[1]*k;o[2]=c[2]*k;return o;}

/* ================= 五种风格 = 五段地理 ================= */
/* 0 暖纸 WARM · 1 雾境 MIST · 2 暮粉 DUSK · 3 雪境 SNOW · 4 夜航 NIGHT */
const STYLE_NAMES=['暖纸 WARM','雾境 MIST','暮粉 DUSK','雪境 SNOW','夜航 NIGHT'];
const PAL_SRC=[
{ skyTop:'#e6dcc6',skyHor:'#f7ecd8',fog:'#efe7d5',fogDist:2700,
  ground:['#e3d2a6','#d6c58f','#cbbd93','#e9ddb8','#c4b784','#dccd9a'],stripe:'#b6a774',
  river:'#b4c4bf',riverHi:'#dde6e0',bank:'#c7bb92',
  wall:'#f2e9d8',wallShade:'#d5c8ad',roof:'#c68b6b',roofShade:'#a66c51',ridge:'#e2ad8b',
  leaf:'#a8ac77',leafShade:'#878c5a',trunk:'#86704f',
  bird:'#f9f5ec',birdShade:'#cbbda6',shadow:'#6d5c3d',
  ink:'#3a362c',poem:'#3a362c',window:'#f6e3a8',glow:'#ffd6a0',
  star:0,snow:0,night:0,glowAmt:.15,particle:0,pcount:70 },
{ skyTop:'#d3d8d6',skyHor:'#e5e8e5',fog:'#dfe3e0',fogDist:850,
  ground:['#c6cbbd','#b9c0b2','#bfc4b6','#cdd1c5','#aeb5a7','#c2c8b9'],stripe:'#a0a89a',
  river:'#c2c9c8',riverHi:'#dfe4e3',bank:'#b3b9ad',
  wall:'#e4e6e1',wallShade:'#c4c8c2',roof:'#8f979b',roofShade:'#737b80',ridge:'#a7aeb2',
  leaf:'#9aa596',leafShade:'#7c877a',trunk:'#7b776e',
  bird:'#f3f4f1',birdShade:'#c0c6c1',shadow:'#5e6660',
  ink:'#3e4340',poem:'#3e4340',window:'#f1e2b3',glow:'#ffe8c8',
  star:0,snow:0,night:0,glowAmt:0,particle:0,pcount:45 },
{ skyTop:'#c9a4b8',skyHor:'#f4c9b4',fog:'#e8bfc0',fogDist:1700,
  ground:['#d9a7a2','#c99a9c','#d3b0a6','#e0b6ac','#bd8f93','#cea39e'],stripe:'#a97c80',
  river:'#dcb59f',riverHi:'#f7dcc0',bank:'#c69c95',
  wall:'#efd5cd',wallShade:'#c9a8a6',roof:'#8f5f78',roofShade:'#6f4a60',ridge:'#b37f95',
  leaf:'#a4837f',leafShade:'#7e6360',trunk:'#6e5350',
  bird:'#f9ece6',birdShade:'#cfa9a8',shadow:'#5c3f4a',
  ink:'#4a3340',poem:'#4a3340',window:'#ffd98f',glow:'#ffc48a',
  star:.15,snow:0,night:0,glowAmt:1,particle:2,pcount:80 },
{ skyTop:'#d6dbe1',skyHor:'#eceef1',fog:'#e6e9ee',fogDist:1500,
  ground:['#eef0f3','#e6e9ed','#f1f2f4','#e2e6eb','#dde2e8','#eaedf0'],stripe:'#c8cfd8',
  river:'#6f7d8c',riverHi:'#98a5b2',bank:'#d8dde3',
  wall:'#e8e4de',wallShade:'#c3bfb9',roof:'#f2f3f5',roofShade:'#cfd4da',ridge:'#ffffff',
  leaf:'#6f8274',leafShade:'#546658',trunk:'#5e544c',
  bird:'#f6f8fb',birdShade:'#c2cad6',shadow:'#5d6672',
  ink:'#3b4048',poem:'#3b4048',window:'#ffe2a0',glow:'#fff0d8',
  star:.1,snow:1,night:0,glowAmt:.25,particle:1,pcount:240 },
{ skyTop:'#1b2138',skyHor:'#33405e',fog:'#2b3450',fogDist:1600,
  ground:['#2f3752','#29304a','#343c57','#2b3350','#242b44','#31395a'],stripe:'#3d4666',
  river:'#151a2c',riverHi:'#151a2c',bank:'#2a3149',
  wall:'#4a506a',wallShade:'#343a52',roof:'#2c3149',roofShade:'#20243a',ridge:'#3a4160',
  leaf:'#2f3d4e',leafShade:'#232d3b',trunk:'#2a2a38',
  bird:'#b9c3d6',birdShade:'#7c889e',shadow:'#0c0f1c',
  ink:'#d9dde8',poem:'#eef1f7',window:'#ffd884',glow:'#ffb877',
  star:1,snow:0,night:1,glowAmt:.9,particle:3,pcount:90 }
];
const PAL=PAL_SRC.map(p=>{const o={};for(const k in p){const v=p[k];
  if(typeof v==='string')o[k]=hexc(v);else if(Array.isArray(v))o[k]=v.map(hexc);else o[k]=v;}return o;});
const COLKEYS=Object.keys(PAL[0]).filter(k=>Array.isArray(PAL[0][k])&&!Array.isArray(PAL[0][k][0]));
const NUMKEYS=Object.keys(PAL[0]).filter(k=>typeof PAL[0][k]==='number');

/* 风格锋面：沿 +X 每段 SEG，锋面按 y 参差，过渡带宽 BAND */
const SEG=8600,BAND=1500;
let startStyle=0;
function styleIdx(k){return (((startStyle+k)%5)+5)%5;}
function frontOffset(k,y){return 560*(noise1(y/420+k*7.31)-.5)*2+240*(noise1(y/130+k*3.7+9)-.5)*2;}
/* 返回 {a,b,t}：从风格 a 向风格 b 过渡的比例 t */
function styleAt(x,y,o){o=o||{a:0,b:0,t:0};const k=Math.floor(x/SEG);
  const d0=x-(k*SEG+frontOffset(k-1,y));const t0=smooth((d0+BAND*.5)/BAND);
  if(t0<1){o.a=styleIdx(k-1);o.b=styleIdx(k);o.t=t0;return o;}
  const d1=x-((k+1)*SEG+frontOffset(k,y));o.a=styleIdx(k);o.b=styleIdx(k+1);o.t=smooth((d1+BAND*.5)/BAND);return o;}
/* 混合后的完整调色板（每帧只算少数几个） */
function blendPal(s,o){o=o||{};const A=PAL[s.a],B=PAL[s.b],t=s.t;
  for(const k of COLKEYS){o[k]=mixc(A[k],B[k],t,o[k]||[0,0,0]);}
  for(const k of NUMKEYS){o[k]=lerp(A[k],B[k],t);}
  if(!o.ground)o.ground=[];for(let i=0;i<6;i++)o.ground[i]=mixc(A.ground[i],B.ground[i],t,o.ground[i]||[0,0,0]);
  o.a=s.a;o.b=s.b;o.t=t;return o;}
/* 单个颜色字段在位置风格下的混合值 */
const _sc={a:0,b:0,t:0};
function colAt(key,x,y,o){styleAt(x,y,_sc);return mixc(PAL[_sc.a][key],PAL[_sc.b][key],_sc.t,o);}
function numAt(key,x,y){styleAt(x,y,_sc);return lerp(PAL[_sc.a][key],PAL[_sc.b][key],_sc.t);}
function groundColAt(i,x,y,o){styleAt(x,y,_sc);return mixc(PAL[_sc.a].ground[i],PAL[_sc.b].ground[i],_sc.t,o);}
/* 雾：距离 d 处向雾色靠拢的比例 */
function fogT(d,fogDist){const t=(d-fogDist*.22)/(fogDist*1.15);return t<=0?0:Math.min(.93,1-Math.exp(-t*t*2.2));}
/* ================= 相机与投影 ================= */
let W=800,H=600,DPR=1,ctx=null,T=0;
const CAM={x:0,y:0,z:200,yaw:0,pitch:.9,fov:1.0,focal:600,pcx:400,pcy:300,fx:1,fy:0,fz:0,rx:0,ry:-1,rz:0,ux:0,uy:0,uz:1};
const NEAR=3;
function camPrep(){const cy=Math.cos(CAM.yaw),sy=Math.sin(CAM.yaw),cp=Math.cos(CAM.pitch),sp=Math.sin(CAM.pitch);
  CAM.fx=cy*cp;CAM.fy=sy*cp;CAM.fz=-sp;CAM.rx=sy;CAM.ry=-cy;CAM.rz=0;CAM.ux=cy*sp;CAM.uy=sy*sp;CAM.uz=cp;
  let f=H*.5/Math.tan(CAM.fov*.5);const maxH=W*.5/Math.tan(.87);if(f<maxH)f=maxH;CAM.focal=f;
  CAM.pcx=W*.43;CAM.pcy=H*.5;}
const CS=new Float64Array(96),CP=new Float64Array(96);
function toCam(x,y,z,o,i){const dx=x-CAM.x,dy=y-CAM.y,dz=z-CAM.z;o[i]=dx*CAM.rx+dy*CAM.ry;o[i+1]=dx*CAM.ux+dy*CAM.uy+dz*CAM.uz;o[i+2]=dx*CAM.fx+dy*CAM.fy+dz*CAM.fz;}
function clipNear(src,n,dst){let m=0;for(let k=0;k<n;k++){const a=k*3,b=((k+1)%n)*3,az=src[a+2],bz=src[b+2],ain=az>NEAR,bin=bz>NEAR;
  if(ain){dst[m]=src[a];dst[m+1]=src[a+1];dst[m+2]=az;m+=3;}
  if(ain!==bin){const t=(NEAR-az)/(bz-az);dst[m]=src[a]+(src[b]-src[a])*t;dst[m+1]=src[a+1]+(src[b+1]-src[a+1])*t;dst[m+2]=NEAR;m+=3;}}
  return m/3;}
let PB_x0=0,PB_y0=0,PB_x1=0,PB_y1=0;
/* 把世界坐标多边形铺成路径；返回是否在屏内（含近平面裁剪） */
function pathPoly(p,n){let allIn=true,anyIn=false;
  for(let k=0;k<n;k++){toCam(p[k*3],p[k*3+1],p[k*3+2],CS,k*3);if(CS[k*3+2]>NEAR)anyIn=true;else allIn=false;}
  if(!anyIn)return false;let src=CS,m=n;if(!allIn){m=clipNear(CS,n,CP);src=CP;if(m<3)return false;}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;ctx.beginPath();
  for(let k=0;k<m;k++){const z=src[k*3+2],s=CAM.focal/z,sx=CAM.pcx+src[k*3]*s,sy=CAM.pcy-src[k*3+1]*s;
    if(k)ctx.lineTo(sx,sy);else ctx.moveTo(sx,sy);if(sx<x0)x0=sx;if(sx>x1)x1=sx;if(sy<y0)y0=sy;if(sy>y1)y1=sy;}
  ctx.closePath();PB_x0=x0;PB_y0=y0;PB_x1=x1;PB_y1=y1;return !(x1<0||x0>W||y1<0||y0>H);}
const PP={sx:0,sy:0,d:0,s:0};
function projPt(x,y,z,o){o=o||PP;const dx=x-CAM.x,dy=y-CAM.y,dz=z-CAM.z;const d=dx*CAM.fx+dy*CAM.fy+dz*CAM.fz;if(d<=NEAR){o.d=d;return false;}
  const s=CAM.focal/d;o.sx=CAM.pcx+(dx*CAM.rx+dy*CAM.ry)*s;o.sy=CAM.pcy-(dx*CAM.ux+dy*CAM.uy+dz*CAM.uz)*s;o.d=d;o.s=s;return true;}
function camDist(x,y,z){const dx=x-CAM.x,dy=y-CAM.y,dz=z-CAM.z;return Math.sqrt(dx*dx+dy*dy+dz*dz);}
const LIGHT=[-.35,.45,.82];(function(){const l=Math.hypot(LIGHT[0],LIGHT[1],LIGHT[2]);LIGHT[0]/=l;LIGHT[1]/=l;LIGHT[2]/=l;})();

/* ================= 河流 ================= */
function riverY(x){return 230*Math.sin(x/920)+95*Math.sin(x/335+1.3)+30*Math.sin(x/97+.4);}
function riverHalf(x){return 26+9*Math.sin(x/640+2)+5*Math.sin(x/173);}
function riverSlope(x){return (riverY(x+8)-riverY(x-8))/16;}

/* ================= 每帧调色板 ================= */
const SC={a:0,b:0,t:0},SF={a:0,b:0,t:0};
const PC=blendPal(styleAt(0,0,SC)),PF=blendPal(styleAt(0,0,SF));
let glowAmt=0,frontT=0;
const _c1=[0,0,0],_c2=[0,0,0],_c3=[0,0,0];
function fogCol(c,d,o){const t=fogT(d,PC.fogDist);return mixc(c,PC.fog,t,o);}

/* ================= 天空 / 星 / 光晕 ================= */
function horizonY(){return CAM.pcy-CAM.focal*Math.tan(CAM.pitch);}
function drawSky(){const yh=horizonY();

  let d1=1e9,fl=0;for(const b of BIRDS){const d=camDist(b.x,b.y,b.z);if(d<d1)d1=d;if(d<110){const q=1-d/110;fl+=q*Math.pow(.5+.5*Math.sin(b.ph),3)*b.amp;}}
  const near=clamp(1-d1/110,0,1);AMB.wingG.gain.setTargetAtTime(Math.min(.5,near*near*.25+fl*.12),t,.03);}
function toggleMusic(){soundOn=!soundOn;const b=document.getElementById('btnMusic');b.classList.toggle('off',!soundOn);b.textContent=soundOn?'♪ 音乐':'♪ 静音';
  if(AC){const t=AC.currentTime;musicMaster.gain.cancelScheduledValues(t);musicMaster.gain.setTargetAtTime(soundOn?.55:0,t,.6);ambMaster.gain.cancelScheduledValues(t);ambMaster.gain.setTargetAtTime(soundOn?1:0,t,.6);}}
/* ================= 诗句层 ================= */
const POEMS=[
 {t:'起程',l:['风把地图折成翅膀','我们只认得一条河','河认得所有的秋天']},
 {t:'河',l:['河在下面慢慢写字','写到弯处','就停下来想一想']},
 {t:'阵',l:['三十个影子排成一个','落在麦田上','麦田一点也不觉得重']},
 {t:'屋顶',l:['屋顶挨着屋顶','像一排合上的书','烟囱是没读完的那页']},
 {t:'雾',l:['雾把远方收进口袋','我们只向前飞一寸','一寸就够了']},
 {t:'暮',l:['天空慢慢变成桃子','我们咬了一口','就飞进了晚上']},
 {t:'雪',l:['雪落在翅膀上','又落进河里','只有河还记得夏天']},
 {t:'夜',l:['每一扇窗都亮着','像有人在等','而我们一直在路上']},
 {t:'星',l:['星星也在迁徙','只是飞得慢','一年才挪一格']},
 {t:'风',l:['风推我们向左','我们就向左','然后再慢慢飞回来']},
 {t:'尖塔',l:['尖塔指着天说：那边','我们点点头','其实早已经知道']},
 {t:'倦',l:['翅膀酸了','就交给后面那只','它也会交给再后面的']},
 {t:'归',l:['没有终点','只有下一段河','和下一张纸']}];
const POEM={on:true,i:0,state:0,at:0};
const poemEl=document.getElementById('poem');
function showPoem(p){poemEl.className='ui';poemEl.innerHTML='';const t=document.createElement('div');t.className='t';t.textContent=p.t;poemEl.appendChild(t);
  const r=document.createElement('div');r.className='rule';poemEl.appendChild(r);let n=0;
  for(const line of p.l){const d=document.createElement('div');d.className='l';for(const ch of line){const s=document.createElement('span');s.className='c';s.textContent=ch;s.style.transitionDelay=(1.2+n*.11)+'s';d.appendChild(s);n++;}poemEl.appendChild(d);}
  requestAnimationFrame(()=>requestAnimationFrame(()=>poemEl.classList.add('on')));}
function updatePoem(){if(!POEM.on){return;}const el=T-POEM.at;
  if(POEM.state===0){if(el>4){showPoem(POEMS[POEM.i%POEMS.length]);POEM.state=1;POEM.at=T;}}
  else if(POEM.state===1){if(el>17){poemEl.classList.add('fade');POEM.state=2;POEM.at=T;}}
  else if(POEM.state===2){if(el>3.2){poemEl.innerHTML='';poemEl.className='ui';POEM.i++;POEM.state=0;POEM.at=T+5+Math.random()*6;}}}
function togglePoem(){POEM.on=!POEM.on;const b=document.getElementById('btnPoem');b.classList.toggle('off',!POEM.on);poemEl.classList.toggle('hidden',!POEM.on);
  if(POEM.on){POEM.state=0;POEM.at=T-2;}else{poemEl.innerHTML='';}}

/* ================= 主循环与 UI ================= */
const cv=document.getElementById('cv');let running=false,lastNow=0;const root=document.documentElement;
function resize(){rotated=window.innerHeight>window.innerWidth;W=rotated?window.innerHeight:window.innerWidth;H=rotated?window.innerWidth:window.innerHeight;
  DPR=Math.min(window.devicePixelRatio||1,IS_TOUCH?2:2);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx=cv.getContext('2d');ctx.setTransform(DPR,0,0,DPR,0,0);grainPat=null;}
window.addEventListener('resize',()=>setTimeout(resize,60));
let uiTick=0;
function updateUI(){uiTick++;if(uiTick%6)return;const ink=PC.ink;root.style.setProperty('--ink',rgba(ink));root.style.setProperty('--ink-rgb',(ink[0]|0)+','+(ink[1]|0)+','+(ink[2]|0));root.style.setProperty('--poem',rgba(PF.poem));}
function render(){styleAt(CAM.x,CAM.y,SC);blendPal(SC,PC);styleAt(FC.x,FC.y,SF);blendPal(SF,PF);
  frontT=4*SC.t*(1-SC.t);const gA=PAL[SC.a].glowAmt,gB=PAL[SC.b].glowAmt;
  const dawn=(PAL[SC.a].night>.5||PAL[SC.b].night>.5)?1:.55;glowAmt=clamp(frontT*Math.max(gA,gB)*dawn+PC.glowAmt*.22,0,1);
  drawSky();drawGround();drawBirdShadows();collectWorld();collectBirds();drawList();drawGrain();}
let rafId=0,toId=0,manualDrive=false;
function frame(now){cancelAnimationFrame(rafId);clearTimeout(toId);if(!manualDrive){rafId=requestAnimationFrame(frame);toId=setTimeout(()=>frame(performance.now()),120);}
  const dt=Math.min(.05,(now-lastNow)/1000)||.016;lastNow=now;T+=dt;
  filterPointer(dt);updateWind(dt);updateFlock(dt);updateCamera(dt);updateParticles(dt,FC.x,FC.y,FC.z,WIND);
  render();updateAudio();updateUI();if(running)updatePoem();}
/* 开场 */
document.querySelectorAll('#intro .scene').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#intro .scene').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
  startStyle=parseInt(b.dataset.s,10);initBirds();CAMS.init=false;PLAN.length=0;planEnd=T;cycleNo=0;PARTS.length=0;}));
let wakeLock=null;
async function keepAwake(){try{if('wakeLock' in navigator){wakeLock=await navigator.wakeLock.request('screen');}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&running)keepAwake();});
document.getElementById('start').addEventListener('click',()=>{
  const app=document.documentElement;
  try{const p=app.requestFullscreen?app.requestFullscreen({navigationUI:'hide'}):(app.webkitRequestFullscreen&&app.webkitRequestFullscreen());
    if(p&&p.then)p.then(()=>{try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}).catch(()=>{});}catch(e){}
  keepAwake();startAudio();document.getElementById('intro').classList.add('gone');running=true;POEM.at=T-1;setTimeout(resize,300);setTimeout(resize,1200);});
document.getElementById('btnMusic').addEventListener('click',toggleMusic);
document.getElementById('btnPoem').addEventListener('click',togglePoem);
resize();initBirds();bindInput();planEnd=0;lastNow=performance.now();frame(lastNow);
</script>
